<title>Statistik &amp; LinA Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=STIX+Two+Text:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kopfzeile mit Fachwechsel, links Themenliste, rechts Thema (Theorie → Ausprobieren → Üben) auf Karopapier */
:root {
  --paper: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #17213A;
  --muted: #586379;
  --line: #D8DDE7;
  --grid: rgba(23, 33, 58, .045);
  --stat: #0B7A71;
  --stat-soft: #DCF0EC;
  --lin: #3A4CCB;
  --lin-soft: #E4E7FB;
  --on-accent: #FFFFFF;
  --good: #1D8148;
  --good-soft: #E0F2E7;
  --bad: #BF3F2B;
  --bad-soft: #FBE5E0;
  --warn: #B26F12;
  --v1: #C8452F;
  --v2: #0B7A71;
  --accent: var(--stat);
  --accent-soft: var(--stat-soft);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141D; --surface: #161D2A; --ink: #E5E9F1; --muted: #98A2B6; --line: #29324A;
    --grid: rgba(229, 233, 241, .035);
    --stat: #45C3B5; --stat-soft: #12302D; --lin: #93A0FF; --lin-soft: #1F2550; --on-accent: #0B111C;
    --good: #52C485; --good-soft: #13301F; --bad: #F07B64; --bad-soft: #3A1D18; --warn: #E4AA4C;
    --v1: #F07B64; --v2: #45C3B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141D; --surface: #161D2A; --ink: #E5E9F1; --muted: #98A2B6; --line: #29324A;
  --grid: rgba(229, 233, 241, .035);
  --stat: #45C3B5; --stat-soft: #12302D; --lin: #93A0FF; --lin-soft: #1F2550; --on-accent: #0B111C;
  --good: #52C485; --good-soft: #13301F; --bad: #F07B64; --bad-soft: #3A1D18; --warn: #E4AA4C;
  --v1: #F07B64; --v2: #45C3B5;
  color-scheme: dark;
}
.app[data-subject="lin"] { --accent: var(--lin); --accent-soft: var(--lin-soft); }
.app[data-subject="stat"] { --accent: var(--stat); --accent-soft: var(--stat-soft); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding-block: 20px 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font: 700 1.25rem/1 var(--f-math); font-style: italic;
}
.brand h1 { margin: 0; font: 700 1.3rem/1.1 var(--f-display); letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.seg { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip {
  display: inline-flex; align-items: center; gap: 10px; font: 600 .82rem/1 var(--f-mono);
  padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--ink); }

/* Gerüst */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.side h2 { margin: 0 0 8px; font: 600 .72rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.topics { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.topics button {
  width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  color: var(--ink);
}
.topics button:hover { background: var(--surface); }
.topics button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.topics .score { font: .72rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.topics .score.full { color: var(--good); }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.t-head .eyebrow { margin: 0 0 4px; font: 600 .74rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.t-head h2 { margin: 0; font: 700 clamp(1.6rem, 3.2vw, 2.2rem)/1.12 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
.t-head .lead { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }

h3 { margin: 0 0 12px; font: 700 1.08rem/1.2 var(--f-display); }
h4 { margin: 18px 0 6px; font: 600 .78rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.theory { max-width: 74ch; }
.theory p, .theory li { max-width: 68ch; }
.theory > h4:first-of-type { margin-top: 4px; }
.f {
  font: 1.17rem/1.6 var(--f-math); padding: 10px 16px; margin: 8px 0; background: var(--accent-soft);
  border-radius: 8px; overflow-x: auto; white-space: nowrap;
}
.f .lbl { font: .8rem var(--f-body); color: var(--muted); margin-left: 14px; font-style: normal; }
.m, .f i, .m i { font-family: var(--f-math); }
.m { font-size: 1.06em; white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; line-height: 1.15; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px 1px; }
.frac > span:last-child { padding: 1px 3px 0; }
.ov { border-top: 1px solid currentColor; padding-top: 1px; }
.keys { padding-left: 1.1em; margin: 10px 0 0; display: grid; gap: 6px; }
.keys b { font-weight: 700; }

.tbl-wrap { overflow-x: auto; margin: 8px 0; }
table.qt { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 320px; }
table.qt th, table.qt td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.qt th { font: 600 .74rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.qt td { font-family: var(--f-math); font-size: 1.04rem; }
table.qt td.txt { font-family: var(--f-body); font-size: .95rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.card-head h3 { margin: 0; }
.card-head .meta { font: .78rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Knöpfe & Felder */
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px;
  font-weight: 600; cursor: pointer; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.small { padding: 6px 11px; font-size: .88rem; }

.ex-prompt { font-size: 1.04rem; max-width: 70ch; }
.ex-prompt p { margin: 8px 0; }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 12px 0; overflow-x: auto; font-family: var(--f-math); font-size: 1.1rem; }
.mrow > span { display: inline-flex; align-items: center; gap: 8px; }
.eqs { font: 1.12rem/1.8 var(--f-math); margin: 10px 0; padding-left: 14px; border-left: 2px solid var(--line); }
.hint { color: var(--muted); font-size: .88rem; margin-top: 6px; }

.ex-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.field > .lab { min-width: 13em; flex: 0 1 auto; }
.field input[type="text"], .field select, .mcell {
  border: 1.5px solid var(--line); background: var(--paper); border-radius: 7px; padding: 7px 10px;
  font: 1rem var(--f-mono); width: 9.5em; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--f-body); width: auto; }
.field .mcell { width: 4.6em; text-align: center; padding: 6px 4px; }
.ok { border-color: var(--good) !important; background: var(--good-soft) !important; }
.no { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.feedback { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-weight: 600; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.solution { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.solution h4 { margin-top: 0; }
.steps { padding-left: 1.3em; margin: 6px 0; display: grid; gap: 8px; }
.steps li { padding-left: 4px; }
.steps li::marker { font: 600 .9rem var(--f-mono); color: var(--accent); }

/* Matrizen */
.mat {
  display: inline-grid; position: relative; padding: 4px 10px; column-gap: 14px; row-gap: 2px;
  font: 1.05rem/1.35 var(--f-math); font-variant-numeric: tabular-nums; vertical-align: middle;
}
.mat::before, .mat::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 6px; border: 1.5px solid currentColor;
}
.mat::before { left: 0; border-right: 0; border-radius: 3px 0 0 3px; }
.mat::after { right: 0; border-left: 0; border-radius: 0 3px 3px 0; }
.mat .c { text-align: right; min-width: 1.4em; }
.mat .c.sep { border-left: 1px solid var(--muted); padding-left: 10px; }
.mat.in { column-gap: 6px; row-gap: 6px; padding: 6px 12px; }
.gauss { display: flex; flex-direction: column; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.gstep { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ops { display: flex; flex-direction: column; gap: 3px; min-width: 13em; }
.ops code { font: .82rem/1.3 var(--f-mono); color: var(--accent); }

/* Werkzeuge */
.tool-note { color: var(--muted); font-size: .92rem; margin: 6px 0 12px; max-width: 70ch; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
.ctl output { font: 600 .9rem var(--f-mono); color: var(--ink); }
.ctl select { border: 1.5px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; }
input[type="range"] { accent-color: var(--accent); width: 200px; max-width: 100%; }
.canvas-wrap { width: 100%; margin-top: 14px; }
.canvas-wrap canvas { display: block; max-width: 100%; }
.readout-line { margin: 10px 0 0; font-weight: 600; }
.readout-line .m { font-weight: 400; }
.lm { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 22px; align-items: start; }
.lm .canvas-wrap { margin-top: 0; }
.lm-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.lm-sliders input[type="range"] { width: 100%; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.readout { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
.readout dt { color: var(--muted); }
.readout dd { margin: 0; font-family: var(--f-math); font-size: 1.05rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--sw); }

/* Quiz */
.q-text { font-size: 1.1rem; font-weight: 600; margin: 4px 0 14px; max-width: 64ch; }
.q-opts { display: grid; gap: 8px; }
.q-opts button {
  text-align: left; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--paper); cursor: pointer; line-height: 1.4;
}
.q-opts button:hover:not(:disabled) { border-color: var(--accent); }
.q-opts button:disabled { cursor: default; }
.q-expl { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); }

/* Fortschritt */
.prog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prog-row .nm { font-weight: 600; }
.prog-row .val { font: .82rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sw, var(--accent)); }
.stat-tiles { display: flex; flex-wrap: wrap; gap: 28px; margin: 4px 0 6px; }
.stat-tiles div { display: flex; flex-direction: column; }
.stat-tiles b { font: 700 1.8rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat-tiles span { color: var(--muted); font-size: .85rem; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .side { position: static; }
  .side h2 { display: none; }
  .topics { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .topics button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .lm { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .field > .lab { min-width: 100%; }
  .card { padding: 16px; }
  .brand p { display: none; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 7px 6px; font-size: .86rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback, .solution, .q-expl { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app" id="app" data-subject="stat">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true" id="brand-mark">x̄</div>

    </div>
    <div class="seg" role="group" aria-label="Bereich wählen">
      <button type="button" id="sw-stat" data-subj="stat">Induktive Statistik</button>
      <button type="button" id="sw-lin" data-subj="lin">Lineare Algebra</button>
      <button type="button" id="sw-prog" data-subj="prog">Fortschritt</button>
    </div>
    <div class="chip" id="chip" title="Richtige Lösungen in Folge und insgesamt"></div>
  </header>
  <div class="layout">
    <aside class="side">
      <h2 id="side-title">Themen</h2>
      <ul class="topics" id="topics"></ul>
    </aside>
    <main id="main"></main>
  </div>
</div>

function genFehler() {

      <li>H₀ wird abgelehnt, wenn <span class="m">${XB} &gt; <i>c</i> = μ₀ + <i>z</i><sub>${fmtP(1 - alpha)}</sub> · ${F("σ", SQ("<i>n</i>"))} = ${c.mu} + ${fmt(q, 3)} · ${fmt(se, 3)} = ${fmt(crit, 3)}</span>.</li>
      <li>Fehler 2. Art: H₀ wird beibehalten, obwohl μ = μ₁. <span class="m">β = P(${XB} ≤ <i>c</i> | μ = μ₁) = Φ(${F(`${fmt(crit, 3)} − ${fmt(mu1, c.d)}`, fmt(se, 3))}) = Φ(${fmt(zb, 3)}) = ${fmt(beta, 4)}</span>.</li>
      <li>Güte: <span class="m">1 − β = ${fmt(1 - beta, 4)}</span>. So oft erkennt der Test den Unterschied tatsächlich.</li>
    </ol>`

function randMat(r, c, lo, hi) { return Array.from({ length: r }, () => Array.from({ length: c }, () => rnd(lo, hi))); }
function genMatMul() {
  const type = pick(["22", "23", "Av", "32"]);

  if (type === "22") { A = randMat(2, 2, -3, 4); B = randMat(2, 2, -3, 4); }
  else if (type === "23") { A = randMat(2, 3, -3, 4); B = randMat(3, 2, -3, 4); }
  else if (type === "32") { A = randMat(3, 2, -3, 4); B = randMat(2, 2, -3, 4); }
  else { A = randMat(3, 3, -3, 4); B = randMat(3, 1, -3, 4); }

  const lines = [];
  C.forEach((r, i) => r.forEach((v, j) => {
    const terms = A[i].map((a, k) => `${pn(a)}·${pn(B[k][j])}`).join(" + ");
    lines.push(`<li><span class="m"><i>c</i><sub>${i + 1}${j + 1}</sub> = ${terms} = ${nm(v)}</span></li>`);
  }));
  const bName = type === "Av" ? "<i>v</i>" : "<i>B</i>";

    prompt: `<p>Berechne das Produkt <span class="m"><i>A</i> · ${bName}</span>.</p>
      <div class="mrow"><span><i>A</i> = ${matHTML(A)}</span><span>${bName} = ${matHTML(B)}</span></div>
      <p class="hint"><i>A</i> ist ${A.length}×${A[0].length}, ${bName} ist ${B.length}×${B[0].length}, das Ergebnis also ${C.length}×${C[0].length}.</p>`,
    fields: [{ label: `<span class="m"><i>A</i> · ${bName}</span> =`, type: "matrix", rows: C.length, cols: C[0].length, ans: C, tol: 1e-9 }],
    solution: `<p>Zeile <i>i</i> von <i>A</i> mal Spalte <i>j</i> von ${bName}:</p><ol class="steps">${lines.join("")}</ol>
      <div class="mrow"><span><i>A</i> · ${bName} = ${matHTML(C)}</span></div>`
  };
}
function genDet() {

      <li><span class="m">− ${pn(A[0][1])} · det${matHTML([[A[1][0], A[1][2]], [A[2][0], A[2][2]]])} = − ${pn(A[0][1])} · ${pn(m2)} = ${nm(-A[0][1] * m2)}</span></li>

function genRang() {

function genVek() {

const PS = [[[1, 1], [0, 1]], [[1, 0], [1, 1]], [[2, 1], [1, 1]], [[1, 1], [1, 2]], [[1, 2], [1, 1]], [[1, -1], [1, 0]], [[3, 1], [2, 1]], [[1, 1], [-1, 0]], [[2, 3], [1, 2]], [[1, 0], [2, 1]], [[1, -1], [0, 1]], [[1, 1], [1, 0]]];
function genEigen() {
  for (;;) {
    const P = pick(PS), l1 = rnd(-3, 5); let l2 = rnd(-3, 5);
    if (l1 === l2) continue;
    const dP = det2(P), Pi = [[P[1][1] * dP, -P[0][1] * dP], [-P[1][0] * dP, P[0][0] * dP]];
    const A = matMul(matMul(P, [[l1, 0], [0, l2]]), Pi);
    if (A.flat().some(x => Math.abs(x) > 12)) continue;
    const lo = Math.min(l1, l2), hi = Math.max(l1, l2);
    const vec = lo === l1 ? [P[0][0], P[1][0]] : [P[0][1], P[1][1]];
    const tr = A[0][0] + A[1][1], dt = det2(A), D = tr * tr - 4 * dt;
    const poly = `λ² ${tr === 0 ? "" : (tr > 0 ? "− " : "+ ") + (Math.abs(tr) === 1 ? "" : Math.abs(tr)) + "λ "}${dt === 0 ? "" : (dt > 0 ? "+ " : "− ") + Math.abs(dt) + " "}= 0`;
    const M = [[A[0][0] - lo, A[0][1]], [A[1][0], A[1][1] - lo]];
    return {
      prompt: `<p>Bestimme die Eigenwerte der Matrix und einen Eigenvektor zum kleineren Eigenwert.</p><div class="mrow"><span><i>A</i> = ${matHTML(A)}</span></div>`,
      fields: [
        { label: `kleinerer Eigenwert <span class="m">λ₁</span>`, ans: lo, tol: 1e-6 },
        { label: `größerer Eigenwert <span class="m">λ₂</span>`, ans: hi, tol: 1e-6 },
        { label: `Eigenvektor zu <span class="m">λ₁</span>`, type: "matrix", rows: 2, cols: 1, ans: vec.map(x => [x]),
          check: vals => { const [x, y] = vals.flat(); return !(Math.abs(x) < 1e-9 && Math.abs(y) < 1e-9) && Math.abs(x * vec[1] - y * vec[0]) < 1e-6; } }
      ],
      solution: `<ol class="steps">
        <li>Charakteristisches Polynom: <span class="m">det(<i>A</i> − λ<i>E</i>) = λ² − Spur(<i>A</i>)·λ + det <i>A</i></span> mit <span class="m">Spur = ${nm(tr)}</span>, <span class="m">det = ${nm(dt)}</span>:
          <div class="f">${poly}</div></li>
        <li><span class="m">λ = ${F(`${nm(tr)} ± ${SQ(`${pn(tr)}² − 4·${pn(dt)}`)}`, 2)} = ${F(`${nm(tr)} ± ${SQ(D)}`, 2)} = ${F(`${nm(tr)} ± ${Math.sqrt(D)}`, 2)}</span>, also <span class="m">λ₁ = ${nm(lo)}</span>, <span class="m">λ₂ = ${nm(hi)}</span>.</li>
        <li>Eigenvektor: Kern von <span class="m"><i>A</i> − (${nm(lo)})<i>E</i> = ${matHTML(M)}</span>. Eine Lösung ist <span class="m"><i>v</i> = ${matHTML(vec.map(x => [x]))}</span>, jedes Vielfache ≠ 0 ebenfalls.</li>
        <li>Probe: <span class="m"><i>A</i><i>v</i> = ${matHTML(matMul(A, vec.map(x => [x])))} = ${nm(lo)} · <i>v</i></span>. Kontrolle: <span class="m">λ₁ + λ₂ = ${nm(lo + hi)} = Spur</span>, <span class="m">λ₁ · λ₂ = ${nm(lo * hi)} = det</span>.</li></ol>`
    };
  }
}

function renderExercise(box, topic) {
  const ex = topic.gen();
  let answered = false;
  const p = progress[topic.id];
  $("#ex-meta").textContent = p ? `${p.c} von ${p.t} richtig` : "Neue Zahlen bei jeder Aufgabe";
  const fieldHTML = (f, i) => {
    if (f.type === "select") return `<div class="field"><label class="lab" for="f${i}">${f.label}</label><select id="f${i}"><option value="">bitte wählen</option>${f.options.map(o => `<option>${o}</option>`).join("")}</select></div>`;
    if (f.type === "matrix") {
      let cells = "";
      for (let r = 0; r < f.rows; r++) for (let c = 0; c < f.cols; c++) cells += `<input type="text" class="mcell" id="f${i}_${r}_${c}" autocomplete="off" aria-label="Zeile ${r + 1}, Spalte ${c + 1}">`;
      return `<div class="field"><span class="lab">${f.label}</span><span class="mat in" style="grid-template-columns:repeat(${f.cols},auto)">${cells}</span></div>`;
    }
    return `<div class="field"><label class="lab" for="f${i}">${f.label}</label><input type="text" id="f${i}" autocomplete="off" spellcheck="false"></div>`;
  };
  box.innerHTML = `<div class="ex-prompt">${ex.prompt}</div>
    <form class="ex-fields" id="ex-form" novalidate>
      ${ex.fields.map(fieldHTML).join("")}
      <p class="hint">Dezimalkomma oder Bruch (z. B. 3/4) sind erlaubt. Kleine Rundungsabweichungen werden akzeptiert.</p>
      <div class="ex-actions">
        <button type="submit" class="btn primary">Prüfen</button>
        <button type="button" class="btn" id="ex-sol">Lösungsweg zeigen</button>
        <button type="button" class="btn ghost" id="ex-new">Neue Aufgabe →</button>
      </div>
    </form>
    <div class="feedback" id="ex-fb" hidden></div>
    <div class="solution" id="ex-solbox" hidden><h4>Lösungsweg</h4>${ex.solution}</div>`;
  const form = $("#ex-form", box);
  form.addEventListener("submit", e => {
    e.preventDefault();
    let good = 0;
    ex.fields.forEach((f, i) => {
      let ok;
      if (f.type === "select") {
        const el = $("#f" + i, box); ok = el.value === f.ans; mark([el], ok);
      } else if (f.type === "matrix") {
        const els = [], vals = [];
        for (let r = 0; r < f.rows; r++) { vals.push([]); for (let c = 0; c < f.cols; c++) { const el = $(`#f${i}_${r}_${c}`, box); els.push(el); vals[r].push(parseNum(el.value)); } }
        if (vals.flat().some(isNaN)) ok = false;
        else if (f.check) ok = f.check(vals);
        else ok = vals.every((row, r) => row.every((v, c) => Math.abs(v - f.ans[r][c]) <= f.tol));
        if (f.check) mark(els, ok);
        else els.forEach((el, k) => { const r = Math.floor(k / f.cols), c = k % f.cols; mark([el], !isNaN(vals[r][c]) && Math.abs(vals[r][c] - f.ans[r][c]) <= f.tol); });
      } else {
        const el = $("#f" + i, box), v = parseNum(el.value);
        ok = !isNaN(v) && (f.check ? f.check(v) : Math.abs(v - f.ans) <= f.tol); mark([el], ok);
      }
      if (ok) good++;
    });
    const all = good === ex.fields.length;
    const fb = $("#ex-fb", box);
    fb.hidden = false; fb.className = "feedback " + (all ? "good" : "bad");
    fb.textContent = all ? "Alles richtig." : `${good} von ${ex.fields.length} Angaben stimmen. Prüfe die rot markierten Felder oder sieh dir den Lösungsweg an.`;
    if (!answered) { answered = true; record(topic.id, all); const q = progress[topic.id]; $("#ex-meta").textContent = `${q.c} von ${q.t} richtig`; }
  });
  $("#ex-sol", box).addEventListener("click", () => {
    $("#ex-solbox", box).hidden = false;
    if (!answered) { answered = true; record(topic.id, false); const q = progress[topic.id]; $("#ex-meta").textContent = `${q.c} von ${q.t} richtig`; }
  });
  $("#ex-new", box).addEventListener("click", () => renderExercise(box, topic));
}
function mark(els, ok) { els.forEach(el => { el.classList.toggle("ok", ok); el.classList.toggle("no", !ok); }); }

/* ---------- Quiz ---------- */
function renderQuiz(box, topic) {
  const order = shuffle(topic.quiz.map((_, i) => i));
  let idx = 0, right = 0;
  function show() {
    if (idx >= order.length) {
      box.innerHTML = `<div class="card-head"><h3>Runde beendet</h3></div><p class="q-text">${right} von ${order.length} richtig.</p><button type="button" class="btn primary" id="q-again">Neue Runde</button>`;
      $("#q-again", box).addEventListener("click", () => renderQuiz(box, topic));
      return;
    }
    const [q, opts, expl] = topic.quiz[order[idx]];
    const shuffled = shuffle(opts.map((o, i) => ({ o, ok: i === 0 })));
    box.innerHTML = `<div class="card-head"><h3>Frage ${idx + 1} von ${order.length}</h3><span class="meta">${right} richtig</span></div>
      <p class="q-text">${q}</p>
      <div class="q-opts">${shuffled.map((s, i) => `<button type="button" data-i="${i}">${s.o}</button>`).join("")}</div>
      <div id="q-after"></div>`;
    box.querySelectorAll(".q-opts button").forEach(b => b.addEventListener("click", () => {
      const s = shuffled[+b.dataset.i];
      box.querySelectorAll(".q-opts button").forEach((x, i) => { x.disabled = true; if (shuffled[i].ok) x.classList.add("ok"); });
      if (!s.ok) b.classList.add("no"); else right++;
      record(topic.id, s.ok);
      $("#q-after", box).innerHTML = `<div class="q-expl"><b>${s.ok ? "Richtig." : "Nicht ganz."}</b> ${expl}</div><div class="ex-actions" style="margin-top:12px"><button type="button" class="btn primary" id="q-next">${idx + 1 < order.length ? "Nächste Frage →" : "Auswertung"}</button></div>`;
      $("#q-next", box).addEventListener("click", () => { idx++; show(); });
      $("#q-next", box).focus();
    }));
  }
  show();
}

/* ---------- Zeichenhilfen ---------- */
const cssv = (el, n) => getComputedStyle(el).getPropertyValue(n).trim();
function setupCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, cv.parentElement.clientWidth);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function watch(cv, draw) {
  redrawers.push(draw);
  let lastW = 0;
  const ro = new ResizeObserver(() => { const w = cv.parentElement.clientWidth; if (Math.abs(w - lastW) > 1) { lastW = w; draw(); } });
  ro.observe(cv.parentElement); cleanups.push(() => ro.disconnect());
}
function shadeArea(ctx, f, a, b, X, Y) {
  if (b <= a) return;
  ctx.beginPath(); ctx.moveTo(X(a), Y(0));
  for (let i = 0; i <= 120; i++) { const x = a + (b - a) * i / 120; ctx.lineTo(X(x), Y(f(x))); }
  ctx.lineTo(X(b), Y(0)); ctx.closePath(); ctx.fill();
}
function strokeCurve(ctx, f, a, b, X, Y) {
  ctx.beginPath();
  for (let i = 0; i <= 240; i++) { const x = a + (b - a) * i / 240; i ? ctx.lineTo(X(x), Y(f(x))) : ctx.moveTo(X(x), Y(f(x))); }
  ctx.stroke();
}
const MONO = '12px "JetBrains Mono", ui-monospace, monospace';

/* ---------- Werkzeug: KI-Simulation ---------- */
function toolKISim(el) {
  el.innerHTML = `<p class="tool-note">Grundgesamtheit: Normalverteilung mit <span class="m">μ = 100</span> und bekanntem <span class="m">σ = 15</span>. Jede waagerechte Linie ist ein Konfidenzintervall aus einer eigenen Zufallsstichprobe. Rot markierte Intervalle verfehlen μ.</p>
    <div class="ctl-row">
      <label class="ctl" for="ks-n"><span>Stichprobenumfang <i>n</i> = <output id="ks-no">25</output></span><input type="range" id="ks-n" min="4" max="100" value="25"></label>
      <label class="ctl" for="ks-c"><span>Konfidenzniveau</span><select id="ks-c"><option value="0.8">80 %</option><option value="0.9">90 %</option><option value="0.95" selected>95 %</option><option value="0.99">99 %</option></select></label>
      <button type="button" class="btn primary" id="ks-go">50 neue Stichproben</button>
    </div>
    <div class="canvas-wrap"><canvas id="ks-cv" role="img" aria-label="50 simulierte Konfidenzintervalle um μ = 100"></canvas></div>
    <p class="readout-line" id="ks-out"></p>`;
  const cv = $("#ks-cv", el), nEl = $("#ks-n", el), cEl = $("#ks-c", el);
  let data = [], total = { hit: 0, all: 0 };
  function sample(reset) {
    if (reset) total = { hit: 0, all: 0 };
    const n = +nEl.value, conf = +cEl.value, q = invPhi(1 - (1 - conf) / 2), se = 15 / Math.sqrt(n);
    data = Array.from({ length: 50 }, () => { const xb = 100 + se * gauss(); return { xb, lo: xb - q * se, hi: xb + q * se }; });
    const hits = data.filter(d => d.lo <= 100 && d.hi >= 100).length;
    total.hit += hits; total.all += 50;
    $("#ks-out", el).innerHTML = `${hits} von 50 Intervallen überdecken μ (${hits * 2} %). Seit der letzten Einstellung: ${total.hit} von ${total.all} = ${fmt(total.hit / total.all * 100, 1)} %, erwartet ${pct(conf)}. Halbe Breite: <span class="m">${fmt(q * se, 2)}</span>.`;
    draw();
  }
  function draw() {
    const { ctx, w, h } = setupCanvas(cv, 360);
    const L = 8, R = 8, T = 8, B = 26, lo = 60, hi = 140;
    const X = x => L + (x - lo) / (hi - lo) * (w - L - R);
    const ink = cssv(cv, "--ink"), muted = cssv(cv, "--muted"), line = cssv(cv, "--line"), acc = cssv(cv, "--accent"), bad = cssv(cv, "--bad");
    ctx.font = MONO; ctx.textAlign = "center"; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let x = lo; x <= hi; x += 10) { ctx.beginPath(); ctx.moveTo(X(x), T); ctx.lineTo(X(x), h - B); ctx.stroke(); ctx.fillText(String(x), X(x), h - 8); }
    const rowH = (h - T - B) / data.length;
    data.forEach((d, i) => {
      const y = T + rowH * (i + 0.5), hit = d.lo <= 100 && d.hi >= 100;
      ctx.strokeStyle = hit ? acc : bad; ctx.fillStyle = hit ? acc : bad; ctx.lineWidth = hit ? 1.6 : 2.4;
      ctx.beginPath(); ctx.moveTo(X(Math.max(lo, d.lo)), y); ctx.lineTo(X(Math.min(hi, d.hi)), y); ctx.stroke();
      ctx.beginPath(); ctx.arc(X(d.xb), y, 2, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(X(100), T - 4); ctx.lineTo(X(100), h - B); ctx.stroke(); ctx.setLineDash([]);
  }
  nEl.addEventListener("input", () => { $("#ks-no", el).textContent = nEl.value; sample(true); });
  cEl.addEventListener("change", () => sample(true));
  $("#ks-go", el).addEventListener("click", () => sample(false));
  watch(cv, draw);
  sample(true);
}

function toolPValue(el) {

    <div class="ctl-row">

    <p class="readout-line" id="pv-out"></p>`;
  const cv = $("#pv-cv", el), zEl = $("#pv-z", el), aEl = $("#pv-a", el), alEl = $("#pv-al", el);
  function draw() {
    const z = +zEl.value, alt = aEl.value, al = +alEl.value;
    $("#pv-zo", el).textContent = fmt(z, 2);
    const { ctx, w, h } = setupCanvas(cv, 280);
    const L = 10, R = 10, T = 22, B = 28;
    const X = x => L + (x + 4) / 8 * (w - L - R), Y = y => h - B - y / 0.42 * (h - T - B);
    const ink = cssv(cv, "--ink"), muted = cssv(cv, "--muted"), line = cssv(cv, "--line"), acc = cssv(cv, "--accent"), bad = cssv(cv, "--bad");
    const crit = alt === "two" ? invPhi(1 - al / 2) : invPhi(1 - al);
    ctx.fillStyle = bad; ctx.globalAlpha = 0.22;
    if (alt !== "greater") shadeArea(ctx, phi, -4, alt === "two" ? -crit : -crit, X, Y);
    if (alt !== "less") shadeArea(ctx, phi, crit, 4, X, Y);
    ctx.fillStyle = acc; ctx.globalAlpha = 0.5;
    if (alt === "two") { shadeArea(ctx, phi, -4, -Math.abs(z), X, Y); shadeArea(ctx, phi, Math.abs(z), 4, X, Y); }
    else if (alt === "greater") shadeArea(ctx, phi, z, 4, X, Y);
    else shadeArea(ctx, phi, -4, z, X, Y);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(w - R, Y(0)); ctx.stroke();
    ctx.font = MONO; ctx.fillStyle = muted; ctx.textAlign = "center";
    for (let i = -4; i <= 4; i++) { ctx.fillText(nm(i), X(i), h - 9); ctx.beginPath(); ctx.moveTo(X(i), Y(0)); ctx.lineTo(X(i), Y(0) + 4); ctx.stroke(); }
    ctx.strokeStyle = ink; ctx.lineWidth = 2; strokeCurve(ctx, phi, -4, 4, X, Y);
    ctx.strokeStyle = bad; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    const crits = alt === "two" ? [-crit, crit] : alt === "greater" ? [crit] : [-crit];
    crits.forEach(c => { ctx.beginPath(); ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), T); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.strokeStyle = acc; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(z), Y(0)); ctx.lineTo(X(z), T - 6); ctx.stroke();
    ctx.fillStyle = ink; ctx.textAlign = X(z) > w - 60 ? "right" : X(z) < 60 ? "left" : "center"; ctx.fillText("z = " + fmt(z, 2), X(z), T - 9);
    const p = pval(z, alt), rej = p < al;
    $("#pv-out", el).innerHTML = `<span class="m"><i>p</i> = ${fmt(p, 4)}</span> ${rej ? "&lt;" : "≥"} <span class="m">α = ${fmtP(al)}</span>: <span style="color:var(${rej ? "--bad" : "--good"})">${rej ? "H₀ ablehnen" : "H₀ nicht ablehnen"}</span>. Kritischer Wert: <span class="m">${alt === "two" ? "±" : alt === "less" ? "−" : ""}${fmt(crit, 3)}</span>.`;
  }
  [zEl, aEl, alEl].forEach(x => x.addEventListener("input", draw));
  watch(cv, draw); draw();
}

/* ---------- Werkzeug: Fehler 1./2. Art ---------- */
function toolFehler(el) {
  el.innerHTML = `<p class="tool-note">Rechtsseitiger Gauß-Test <span class="m">H₀: μ ≤ 100</span> mit <span class="m">σ = 15</span>. Links die Verteilung von ${XB} unter H₀, rechts unter dem wahren Wert μ₁.</p>
    <div class="ctl-row">
      <label class="ctl" for="fe-m"><span>wahrer Wert μ₁ = <output id="fe-mo">106</output></span><input type="range" id="fe-m" min="100" max="120" step="0.5" value="106"></label>
      <label class="ctl" for="fe-n"><span>Stichprobenumfang <i>n</i> = <output id="fe-no">25</output></span><input type="range" id="fe-n" min="4" max="150" value="25"></label>
      <label class="ctl" for="fe-a"><span>Niveau α</span><select id="fe-a"><option value="0.01">1 %</option><option value="0.05" selected>5 %</option><option value="0.1">10 %</option></select></label>
    </div>
    <div class="canvas-wrap"><canvas id="fe-cv" role="img" aria-label="Verteilungen unter H0 und H1 mit Fehlerflächen"></canvas></div>
    <div class="legend"><span style="--sw:var(--bad)">α: Fehler 1. Art</span><span style="--sw:var(--warn)">β: Fehler 2. Art</span><span style="--sw:var(--accent)">Güte 1 − β</span></div>
    <p class="readout-line" id="fe-out"></p>`;
  const cv = $("#fe-cv", el), mEl = $("#fe-m", el), nEl = $("#fe-n", el), aEl = $("#fe-a", el);
  function draw() {
    const mu1 = +mEl.value, n = +nEl.value, al = +aEl.value, se = 15 / Math.sqrt(n);
    $("#fe-mo", el).textContent = fmt(mu1, 1); $("#fe-no", el).textContent = n;
    const c = 100 + invPhi(1 - al) * se, beta = Phi((c - mu1) / se);
    const { ctx, w, h } = setupCanvas(cv, 280);
    const L = 10, R = 10, T = 22, B = 28, lo = 100 - 4 * se, hi = Math.max(mu1, c) + 4 * se;
    const f0 = x => phi((x - 100) / se) / se, f1 = x => phi((x - mu1) / se) / se, ymax = 0.42 / se;
    const X = x => L + (x - lo) / (hi - lo) * (w - L - R), Y = y => h - B - y / ymax * (h - T - B);
    const ink = cssv(cv, "--ink"), muted = cssv(cv, "--muted"), line = cssv(cv, "--line"), acc = cssv(cv, "--accent"), bad = cssv(cv, "--bad"), warn = cssv(cv, "--warn");
    ctx.globalAlpha = 0.22; ctx.fillStyle = acc; shadeArea(ctx, f1, c, hi, X, Y);
    ctx.globalAlpha = 0.45; ctx.fillStyle = warn; shadeArea(ctx, f1, lo, c, X, Y);
    ctx.fillStyle = bad; shadeArea(ctx, f0, c, hi, X, Y); ctx.globalAlpha = 1;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(w - R, Y(0)); ctx.stroke();
    ctx.font = MONO; ctx.fillStyle = muted; ctx.textAlign = "center";
    const step = (hi - lo) > 40 ? 10 : (hi - lo) > 16 ? 5 : 2;
    for (let x = Math.ceil(lo / step) * step; x <= hi; x += step) ctx.fillText(String(x), X(x), h - 9);
    ctx.lineWidth = 2; ctx.strokeStyle = ink; strokeCurve(ctx, f0, lo, hi, X, Y);
    ctx.strokeStyle = acc; strokeCurve(ctx, f1, lo, hi, X, Y);
    ctx.fillStyle = ink; ctx.fillText("H₀", X(100), Y(ymax * 0.95) - 4);
    ctx.fillStyle = acc; if (Math.abs(X(mu1) - X(100)) > 24) ctx.fillText("H₁", X(mu1), Y(ymax * 0.95) - 4);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), T - 4); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = ink; ctx.fillText("c = " + fmt(c, 2), X(c), T - 8);
    $("#fe-out", el).innerHTML = `<span class="m">α = ${fmtP(al)}</span> · <span class="m">β = ${fmt(beta, 3)}</span> · Güte <span class="m">1 − β = ${fmt(1 - beta, 3)}</span> · Standardfehler <span class="m">${fmt(se, 2)}</span>`;
  }
  [mEl, nEl, aEl].forEach(x => x.addEventListener("input", draw));
  watch(cv, draw); draw();
}

/* ---------- Werkzeug: Lineare Abbildung ---------- */
const PRESETS = [
  ["Identität", [1, 0, 0, 1]], ["Drehung 30°", [0.87, -0.5, 0.5, 0.87]], ["Scherung", [1, 1, 0, 1]],
  ["Spiegelung", [1, 0, 0, -1]], ["Streckung", [2, 0, 0, 0.5]], ["Projektion", [1, 0, 0, 0]],
  ["Symmetrisch", [2, 1, 1, 2]], ["Beispiel", [1, 2, 2, 1]]
];
function toolLinMap(el, id) {
  const start = id === "eig" ? [2, 1, 1, 2] : [1, 1, 0, 1];
  el.innerHTML = `<p class="tool-note">Das graue Gitter ist die Ausgangsebene, das farbige ihr Bild unter <i>A</i>. Die Pfeile zeigen <span style="color:var(--v1)"><i>A</i><i>e</i>₁</span> (erste Spalte) und <span style="color:var(--v2)"><i>A</i><i>e</i>₂</span> (zweite Spalte). Gestrichelte Geraden sind Eigenrichtungen.</p>
    <div class="lm">
      <div>
        <div class="lm-sliders">
          ${["a", "b", "c", "d"].map((k, i) => `<label class="ctl" for="lm-${k}"><span><i>${k}</i> = <output id="lm-${k}o">${fmt(start[i], 1)}</output></span><input type="range" id="lm-${k}" min="-3" max="3" step="0.1" value="${start[i]}"></label>`).join("")}
        </div>
        <div class="mrow" id="lm-mat"></div>
        <div class="presets">${PRESETS.map((p, i) => `<button type="button" class="btn small" data-p="${i}">${p[0]}</button>`).join("")}</div>
        <dl class="readout" id="lm-read"></dl>
      </div>
      <div class="canvas-wrap"><canvas id="lm-cv" role="img" aria-label="Bild des Gitters unter der linearen Abbildung"></canvas></div>
    </div>`;
  const cv = $("#lm-cv", el), ins = ["a", "b", "c", "d"].map(k => $("#lm-" + k, el));
  function draw() {
    const [a, b, c, d] = ins.map(x => +x.value);
    ["a", "b", "c", "d"].forEach((k, i) => { $(`#lm-${k}o`, el).textContent = fmt(+ins[i].value, 1); });
    $("#lm-mat", el).innerHTML = `<span><i>A</i> = ${matHTML([[fmt(a, 1), fmt(b, 1)], [fmt(c, 1), fmt(d, 1)]])}</span>`;
    const size = Math.min(cv.parentElement.clientWidth, 460);
    const { ctx, w, h } = setupCanvas(cv, size);
    const range = 4, s = Math.min(w, h) / (2 * range), cx = w / 2, cy = h / 2;
    const P = (x, y) => [cx + x * s, cy - y * s], M = (x, y) => [a * x + b * y, c * x + d * y];
    const ink = cssv(cv, "--ink"), muted = cssv(cv, "--muted"), line = cssv(cv, "--line"), acc = cssv(cv, "--accent"), v1 = cssv(cv, "--v1"), v2 = cssv(cv, "--v2"), warn = cssv(cv, "--warn");
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let i = -range; i <= range; i++) {
      ctx.beginPath(); ctx.moveTo(...P(i, -range)); ctx.lineTo(...P(i, range)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(...P(-range, i)); ctx.lineTo(...P(range, i)); ctx.stroke();
    }
    ctx.strokeStyle = muted; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(...P(-range, 0)); ctx.lineTo(...P(range, 0)); ctx.moveTo(...P(0, -range)); ctx.lineTo(...P(0, range)); ctx.stroke();
    ctx.strokeStyle = acc; ctx.globalAlpha = 0.45; ctx.lineWidth = 1;
    const G = 12;
    for (let i = -G; i <= G; i++) {
      ctx.beginPath(); ctx.moveTo(...P(...M(i, -G))); ctx.lineTo(...P(...M(i, G))); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(...P(...M(-G, i))); ctx.lineTo(...P(...M(G, i))); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const det = a * d - b * c;
    ctx.fillStyle = det < 0 ? warn : acc; ctx.globalAlpha = 0.22;
    ctx.beginPath(); ctx.moveTo(...P(0, 0)); ctx.lineTo(...P(a, c)); ctx.lineTo(...P(a + b, c + d)); ctx.lineTo(...P(b, d)); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    const tr = a + d, disc = tr * tr - 4 * det;
    let eig = "";
    if (disc >= -1e-9) {
      const r = Math.sqrt(Math.max(0, disc)), ls = [(tr - r) / 2, (tr + r) / 2];
      eig = r < 1e-9 ? `λ = ${fmt(ls[0], 2)} (doppelt)` : `λ₁ = ${fmt(ls[0], 2)}, λ₂ = ${fmt(ls[1], 2)}`;
      const scalar = Math.abs(b) < 1e-9 && Math.abs(c) < 1e-9 && Math.abs(a - d) < 1e-9;
      if (!scalar) {
        ctx.setLineDash([6, 5]); ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
        const uniq = r < 1e-9 ? [ls[0]] : ls;
        uniq.forEach(l => {
          let v = Math.abs(b) > 1e-9 ? [b, l - a] : Math.abs(c) > 1e-9 ? [l - d, c] : (Math.abs(l - a) < 1e-9 ? [1, 0] : [0, 1]);
          const nrm = Math.hypot(...v); v = [v[0] / nrm * 10, v[1] / nrm * 10];
          ctx.beginPath(); ctx.moveTo(...P(-v[0], -v[1])); ctx.lineTo(...P(v[0], v[1])); ctx.stroke();
        });
        ctx.setLineDash([]);
      }
    } else {
      const re = tr / 2, im = Math.sqrt(-disc) / 2;
      eig = `${fmt(re, 2)} ± ${fmt(im, 2)}i (keine reelle Eigenrichtung)`;
    }
    const arrow = (x, y, col) => {
      const [x0, y0] = P(0, 0), [x1, y1] = P(x, y), ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      if (len > 6) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 11 * Math.cos(ang - 0.4), y1 - 11 * Math.sin(ang - 0.4)); ctx.lineTo(x1 - 11 * Math.cos(ang + 0.4), y1 - 11 * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill(); }
    };
    arrow(a, c, v1); arrow(b, d, v2);
    ctx.restore();
    $("#lm-read", el).innerHTML = `<dt>det <i>A</i></dt><dd>${fmt(det, 2)}${det < 0 ? " · Orientierung umgekehrt" : Math.abs(det) < 1e-9 ? " · Ebene kollabiert" : ""}</dd>
      <dt>Flächenfaktor</dt><dd>${fmt(Math.abs(det), 2)}</dd><dt>Spur</dt><dd>${fmt(tr, 2)}</dd><dt>Eigenwerte</dt><dd>${eig}</dd>`;
  }
  ins.forEach(x => x.addEventListener("input", draw));
  el.querySelectorAll("[data-p]").forEach(btn => btn.addEventListener("click", () => {
    PRESETS[+btn.dataset.p][1].forEach((v, i) => { ins[i].value = v; }); draw();
  }));
  watch(cv, draw); draw();
}

/* ---------- Thema & Start ---------- */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
const redrawAll = () => redrawers.forEach(f => f());
if (mq.addEventListener) mq.addEventListener("change", redrawAll);
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
updateChip();
render();
</script>
