<title>Statistik &amp; LinA Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=STIX+Two+Text:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kopfzeile mit Fachwechsel, links Themenliste, rechts Thema (Theorie → Ausprobieren → Üben) auf Karopapier */
:root {
  --paper: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #17213A;
  --muted: #586379;
  --line: #D8DDE7;
  --grid: rgba(23, 33, 58, .045);
  --stat: #0B7A71;
  --stat-soft: #DCF0EC;
  --lin: #3A4CCB;
  --lin-soft: #E4E7FB;
  --on-accent: #FFFFFF;
  --good: #1D8148;
  --good-soft: #E0F2E7;
  --bad: #BF3F2B;
  --bad-soft: #FBE5E0;
  --warn: #B26F12;
  --v1: #C8452F;
  --v2: #0B7A71;
  --accent: var(--stat);
  --accent-soft: var(--stat-soft);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141D; --surface: #161D2A; --ink: #E5E9F1; --muted: #98A2B6; --line: #29324A;
    --grid: rgba(229, 233, 241, .035);
    --stat: #45C3B5; --stat-soft: #12302D; --lin: #93A0FF; --lin-soft: #1F2550; --on-accent: #0B111C;
    --good: #52C485; --good-soft: #13301F; --bad: #F07B64; --bad-soft: #3A1D18; --warn: #E4AA4C;
    --v1: #F07B64; --v2: #45C3B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141D; --surface: #161D2A; --ink: #E5E9F1; --muted: #98A2B6; --line: #29324A;
  --grid: rgba(229, 233, 241, .035);
  --stat: #45C3B5; --stat-soft: #12302D; --lin: #93A0FF; --lin-soft: #1F2550; --on-accent: #0B111C;
  --good: #52C485; --good-soft: #13301F; --bad: #F07B64; --bad-soft: #3A1D18; --warn: #E4AA4C;
  --v1: #F07B64; --v2: #45C3B5;
  color-scheme: dark;
}
.app[data-subject="lin"] { --accent: var(--lin); --accent-soft: var(--lin-soft); }
.app[data-subject="stat"] { --accent: var(--stat); --accent-soft: var(--stat-soft); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding-block: 20px 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font: 700 1.25rem/1 var(--f-math); font-style: italic;
}
.brand h1 { margin: 0; font: 700 1.3rem/1.1 var(--f-display); letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.seg { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip {
  display: inline-flex; align-items: center; gap: 10px; font: 600 .82rem/1 var(--f-mono);
  padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--ink); }

/* Gerüst */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.side h2 { margin: 0 0 8px; font: 600 .72rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.topics { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.topics button {
  width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  color: var(--ink);
}
.topics button:hover { background: var(--surface); }
.topics button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.topics .score { font: .72rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.topics .score.full { color: var(--good); }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.t-head .eyebrow { margin: 0 0 4px; font: 600 .74rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.t-head h2 { margin: 0; font: 700 clamp(1.6rem, 3.2vw, 2.2rem)/1.12 var(--f-display); letter-spacing: -.015em; text-wrap: balance; }
.t-head .lead { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }

h3 { margin: 0 0 12px; font: 700 1.08rem/1.2 var(--f-display); }
h4 { margin: 18px 0 6px; font: 600 .78rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.theory { max-width: 74ch; }
.theory p, .theory li { max-width: 68ch; }
.theory > h4:first-of-type { margin-top: 4px; }
.f {
  font: 1.17rem/1.6 var(--f-math); padding: 10px 16px; margin: 8px 0; background: var(--accent-soft);
  border-radius: 8px; overflow-x: auto; white-space: nowrap;
}
.f .lbl { font: .8rem var(--f-body); color: var(--muted); margin-left: 14px; font-style: normal; }
.m, .f i, .m i { font-family: var(--f-math); }
.m { font-size: 1.06em; }
.frac, .binom, sub, sup { white-space: nowrap; }
.steps > li, .keys > li { min-width: 0; overflow-wrap: anywhere; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; line-height: 1.15; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px 1px; }
.frac > span:last-child { padding: 1px 3px 0; }
.ov { border-top: 1px solid currentColor; padding-top: 1px; }
.keys { padding-left: 1.1em; margin: 10px 0 0; display: grid; gap: 6px; }
.keys b { font-weight: 700; }

.tbl-wrap { overflow-x: auto; margin: 8px 0; }
table.qt { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 320px; }
table.qt th, table.qt td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.qt th { font: 600 .74rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.qt td { font-family: var(--f-math); font-size: 1.04rem; }
table.qt td.txt { font-family: var(--f-body); font-size: .95rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.card-head h3 { margin: 0; }
.card-head .meta { font: .78rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Knöpfe & Felder */
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px;
  font-weight: 600; cursor: pointer; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.small { padding: 6px 11px; font-size: .88rem; }

.ex-prompt { font-size: 1.04rem; max-width: 70ch; }
.ex-prompt p { margin: 8px 0; }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 12px 0; overflow-x: auto; font-family: var(--f-math); font-size: 1.1rem; }
.mrow > span { display: inline-flex; align-items: center; gap: 8px; }
.eqs { font: 1.12rem/1.8 var(--f-math); margin: 10px 0; padding-left: 14px; border-left: 2px solid var(--line); }
.hint { color: var(--muted); font-size: .88rem; margin-top: 6px; }

.ex-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.field > .lab { min-width: 13em; flex: 0 1 auto; }
.field input[type="text"], .field select, .mcell {
  border: 1.5px solid var(--line); background: var(--paper); border-radius: 7px; padding: 7px 10px;
  font: 1rem var(--f-mono); width: 9.5em; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--f-body); width: auto; }
.field input.mcell { width: 4.2em; text-align: center; padding: 6px 4px; }
.ok { border-color: var(--good) !important; background: var(--good-soft) !important; }
.no { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.feedback { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-weight: 600; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.solution { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.solution h4 { margin-top: 0; }
.steps { padding-left: 1.3em; margin: 6px 0; display: grid; gap: 8px; }
.steps li { padding-left: 4px; }
.steps li::marker { font: 600 .9rem var(--f-mono); color: var(--accent); }

/* Matrizen */
.mat {
  display: inline-grid; position: relative; padding: 4px 10px; column-gap: 14px; row-gap: 2px;
  font: 1.05rem/1.35 var(--f-math); font-variant-numeric: tabular-nums; vertical-align: middle;
}
.mat::before, .mat::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 6px; border: 1.5px solid currentColor;
}
.mat::before { left: 0; border-right: 0; border-radius: 3px 0 0 3px; }
.mat::after { right: 0; border-left: 0; border-radius: 0 3px 3px 0; }
.mat .c { text-align: right; min-width: 1.4em; }
.mat .c.sep { border-left: 1px solid var(--muted); padding-left: 10px; }
.mat.in { column-gap: 6px; row-gap: 6px; padding: 6px 12px; }
.gauss { display: flex; flex-direction: column; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.gstep { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ops { display: flex; flex-direction: column; gap: 3px; min-width: 13em; }
.ops code { font: .82rem/1.3 var(--f-mono); color: var(--accent); }

/* Werkzeuge */
.tool-note { color: var(--muted); font-size: .92rem; margin: 6px 0 12px; max-width: 70ch; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
.ctl output { font: 600 .9rem var(--f-mono); color: var(--ink); }
.ctl select { border: 1.5px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; }
input[type="range"] { accent-color: var(--accent); width: 200px; max-width: 100%; }
.canvas-wrap { width: 100%; margin-top: 14px; }
.canvas-wrap canvas { display: block; max-width: 100%; }
.readout-line { margin: 10px 0 0; font-weight: 600; }
.readout-line .m { font-weight: 400; }
.lm { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 22px; align-items: start; }
.lm .canvas-wrap { margin-top: 0; }
.lm-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.lm-sliders input[type="range"] { width: 100%; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.readout { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
.readout dt { color: var(--muted); }
.readout dd { margin: 0; font-family: var(--f-math); font-size: 1.05rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--sw); }

/* Quiz */
.q-text { font-size: 1.1rem; font-weight: 600; margin: 4px 0 14px; max-width: 64ch; }
.q-opts { display: grid; gap: 8px; }
.q-opts button {
  text-align: left; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--paper); cursor: pointer; line-height: 1.4;
}
.q-opts button:hover:not(:disabled) { border-color: var(--accent); }
.q-opts button:disabled { cursor: default; }
.q-expl { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); }

/* Fortschritt */
.prog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prog-row .nm { font-weight: 600; }
.prog-row .val { font: .82rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sw, var(--accent)); }
.stat-tiles { display: flex; flex-wrap: wrap; gap: 28px; margin: 4px 0 6px; }
.stat-tiles div { display: flex; flex-direction: column; }
.stat-tiles b { font: 700 1.8rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat-tiles span { color: var(--muted); font-size: .85rem; }

.grp { margin: 14px 0 4px; padding: 0 10px; font: 600 .7rem/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.grp:first-child { margin-top: 0; }
.grp.aus { border-top: 1px dashed var(--line); padding-top: 12px; }
.side { max-height: calc(100vh - 24px); overflow-y: auto; }
.aus-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; max-width: 62ch; }
.binom { display: inline-flex; align-items: center; vertical-align: middle; }
.binom .pa { font-size: 1.9em; font-weight: 300; line-height: 1; }
.binom .bc { display: inline-flex; flex-direction: column; text-align: center; line-height: 1.1; font-size: .9em; margin: 0 1px; }
.tilde { font: 1.3rem var(--f-math); color: var(--muted); }
table.tab { border-collapse: collapse; font: 1rem var(--f-math); font-variant-numeric: tabular-nums; margin: 6px 0; }
table.tab th, table.tab td { padding: 4px 12px; text-align: right; border-bottom: 1px solid var(--line); }
table.tab th { font-weight: 400; color: var(--muted); }
table.tab th:last-child, table.tab td:last-child { border-left: 1px solid var(--muted); }
table.tab tbody tr:first-child td { border-bottom: 1.5px solid var(--muted); }
table.tab td.piv { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
table.qt tr.best td { background: var(--accent-soft); font-weight: 700; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .side { position: static; }
  .side h2 { display: none; }
  .topics { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .topics button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .side { max-height: none; overflow: visible; }
  .grp { display: none; }
  .lm { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .field > .lab { min-width: 100%; }
  .card { padding: 16px; }
  .brand p { display: none; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 7px 6px; font-size: .86rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback, .solution, .q-expl { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app" id="app" data-subject="stat">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true" id="brand-mark">x̄</div>
      <div>
        <h1>Statistik &amp; LinA Trainer</h1>
        <p>Nach deinen Skripten MS02: Zufallsvariablen, Verteilungen, Lineare Algebra und Optimierung</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Bereich wählen">
      <button type="button" id="sw-stat" data-subj="stat">Induktive Statistik</button>
      <button type="button" id="sw-lin" data-subj="lin">Lineare Algebra</button>
      <button type="button" id="sw-prog" data-subj="prog">Fortschritt</button>
    </div>
    <div class="chip" id="chip" title="Richtige Lösungen in Folge und insgesamt"></div>
  </header>
  <div class="layout">
    <aside class="side">
      <h2 id="side-title">Themen</h2>
      <ul class="topics" id="topics"></ul>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const uni = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const roundTo = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(x, d = 2) {
  if (!isFinite(x)) return "–";
  let s = Math.abs(x).toFixed(d);
  const neg = x < 0 && Number(s) !== 0;
  return (neg ? "−" : "") + s.replace(".", ",");
}
const fmtP = p => String(+p.toFixed(4)).replace(".", ",");
const nm = x => (x < 0 ? "−" : "") + Math.abs(x);
const pn = x => (x < 0 ? "(" + nm(x) + ")" : nm(x));
const pct = c => String(Math.round(c * 100)) + " %";
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const SQ = x => `√<span class="ov">${x}</span>`;
const XB = "x̄";
function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/−/g, "-").replace(/\s+/g, "").replace(",", ".");
  if (s === "") return NaN;
  if (s.includes("/")) {
    const [a, b] = s.split("/");
    const v = Number(a) / Number(b);
    return isFinite(v) ? v : NaN;
  }
  if (s.endsWith("%")) return Number(s.slice(0, -1)) / 100;
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? Number(s) : NaN;
}

/* ---------- Verteilungen ---------- */
function erf(x) {
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
const phi = z => Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
function invPhi(p) {
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];

function genRang() {

function binom(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
const pBin = (x, n, p) => binom(n, x) * p ** x * (1 - p) ** (n - x);
const pHyp = (x, N, S, n) => binom(S, x) * binom(N - S, n - x) / binom(N, n);
const pPoi = (x, l) => Math.exp(-l + x * Math.log(l) - lgamma(x + 1));
const pGeo = (x, p) => (1 - p) ** x * p;
const BC = (n, k) => `<span class="binom"><span class="pa">(</span><span class="bc"><span>${n}</span><span>${k}</span></span><span class="pa">)</span></span>`;
const fmtD = x => { const s = String(+x.toFixed(4)).replace(".", ","); return s.startsWith("-") ? "−" + s.slice(1) : s; };
const fmtI = x => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

function genZV() {
  const start = rnd(0, 2), m = rnd(4, 5), d = pick([10, 12, 20, 36]);
  const xs = Array.from({ length: m }, (_, i) => start + i);
  const cuts = shuffle(Array.from({ length: d - 1 }, (_, i) => i + 1)).slice(0, m - 1).sort((a, b) => a - b);

function genGeo() {

  else { p = pick([0.1, 0.15, 0.2]); pS = fmtD(p); intro = `Ein Vertriebler schließt jedes Telefonat unabhängig mit Wahrscheinlichkeit ${pS} ab. ${X_} ist die Anzahl der Telefonate ohne Abschluss vor dem ersten Abschluss.`; }

      { label: `<span class="m">E(${X_})</span>`, ans: q / p, tol: 0.011 },

      <li><span class="m"><i>f</i><sub>Geo</sub>(${x}; <i>p</i>) = <i>q</i><sup>${x}</sup><i>p</i> = ${fmt(q ** x * p, 4)}</span></li>
      <li><span class="m"><i>F</i><sub>Geo</sub>(${x0}) = 1 − <i>q</i><sup>${x0 + 1}</sup> = 1 − ${fmt(q ** (x0 + 1), 4)} = ${fmt(1 - q ** (x0 + 1), 4)}</span></li>
      <li><span class="m">E(${X_}) = <i>q</i>/<i>p</i> = ${fmt(q / p, 4)}</span>, <span class="m">σ = ${SQ("<i>q</i>")}/<i>p</i> = ${fmt(Math.sqrt(q) / p, 4)}</span></li></ol>`

function genStetig() {

      prompt: `<p>Ein Bus fährt laut Fahrplan alle ${T} Minuten. Ein Fahrgast kommt zu einem zufälligen Zeitpunkt an die Haltestelle. Die Wartezeit <i>T</i> ist rechteckverteilt auf <span class="m">[0, ${T}]</span>.</p><p>Wie groß ist die Wahrscheinlichkeit, länger als ${t} Minuten zu warten? Bestimme außerdem E(<i>T</i>) und σ<sub><i>T</i></sub>.</p>`,
      fields: [
        { label: `<span class="m">P(<i>T</i> &gt; ${t})</span>`, ans: 1 - t / T, tol: 0.002 },
        { label: `<span class="m">E(<i>T</i>)</span>`, ans: T / 2, tol: 0.006 },
        { label: `<span class="m">σ<sub><i>T</i></sub></span>`, ans: T / Math.sqrt(12), tol: 0.006 }
      ],
      solution: `<ol class="steps"><li><span class="m">P(<i>T</i> &gt; ${t}) = 1 − <i>F</i><sub>R</sub>(${t}) = 1 − ${F(`${t} − 0`, `${T} − 0`)} = ${fmt(1 - t / T, 4)}</span></li>
        <li><span class="m">E(<i>T</i>) = ${F("<i>a</i> + <i>b</i>", 2)} = ${fmtD(T / 2)}</span>, <span class="m">Var(<i>T</i>) = ${F("(<i>b</i> − <i>a</i>)²", 12)} = ${fmt(T * T / 12, 4)}</span>, <span class="m">σ = ${fmt(T / Math.sqrt(12), 4)}</span></li></ol>`
    };
  }
  const [mu, unit, what] = pick([[5000, "Stunden", "Lebensdauer einer Glühbirne"], [2000, "Stunden", "Laufzeit eines Lüfters bis zum Ausfall"], [8, "Jahre", "Nutzungsdauer einer Maschine"], [4, "Minuten", "Zeit zwischen zwei Kundenankünften"]]);
  const a = mu * pick([0.25, 0.5, 0.75]), b = mu * pick([1.5, 2, 3]);
  return {
    prompt: `<p>Die ${what} ist exponentialverteilt mit Erwartungswert <span class="m">μ = ${fmtI(mu)}</span> ${unit}.</p><p>Bestimme λ, die Wahrscheinlichkeit für weniger als ${fmtI(a)} ${unit} und für mehr als ${fmtI(b)} ${unit}.</p>`,
    fields: [
      { label: "λ", ans: 1 / mu, check: v => Math.abs(v - 1 / mu) <= 0.005 / mu },
      { label: `<span class="m">P(${X_} &lt; ${fmtI(a)})</span>`, ans: 1 - Math.exp(-a / mu), tol: 0.002 },
      { label: `<span class="m">P(${X_} &gt; ${fmtI(b)})</span>`, ans: Math.exp(-b / mu), tol: 0.002 }
    ],
    solution: `<ol class="steps"><li><span class="m">λ = 1/μ = 1/${fmtI(mu)} = ${fmtD(1 / mu)}</span></li>
      <li><span class="m">P(${X_} &lt; ${fmtI(a)}) = <i>F</i><sub>Ex</sub>(${fmtI(a)}) = 1 − <i>e</i><sup>−${fmtI(a)}/${fmtI(mu)}</sup> = 1 − <i>e</i><sup>−${fmtD(a / mu)}</sup> ≈ ${fmt(1 - Math.exp(-a / mu), 4)}</span></li>
      <li><span class="m">P(${X_} &gt; ${fmtI(b)}) = 1 − <i>F</i><sub>Ex</sub>(${fmtI(b)}) = <i>e</i><sup>−${fmtD(b / mu)}</sup> ≈ ${fmt(Math.exp(-b / mu), 4)}</span></li></ol>`
  };
}
function genNormal() {
  const c = pick([{ t: "die Füllmenge einer Flasche in ml", mu: 500, s: [2, 6] }, { t: "die Körpergröße in cm", mu: 175, s: [6, 10] }, { t: "die erreichte Punktzahl in einer Klausur", mu: 60, s: [8, 14] }, { t: "die Zufallsvariable X", mu: rnd(3, 20), s: [2, 5] }]);
  const sg = rnd(...c.s), mu = c.mu, v = pick(["int", "int", "right", "left", "quant"]);
  const head = `<p>${X_} beschreibe ${c.t} und sei normalverteilt mit <span class="m">E(${X_}) = ${mu}</span> und <span class="m">Var(${X_}) = ${sg * sg}</span>.</p>`;
  const zs = x => (x - mu) / sg;
  const step = (x, n) => `<span class="m"><i>z</i><sub>${n}</sub> = ${F(`${x} − ${mu}`, sg)} = ${fmt(zs(x), 3)}</span>`;
  if (v === "quant") {
    const al = pick([0.01, 0.025, 0.05, 0.1]), z = invPhi(1 - al), cc = mu + z * sg;
    return {
      prompt: head + `<p>Welcher Wert <i>c</i> wird nur mit Wahrscheinlichkeit ${pct(al).replace(" %", "")} % überschritten, d. h. <span class="m">P(${X_} &gt; <i>c</i>) = ${fmtD(al)}</span>?</p>`,
      fields: [{ label: `Quantil <span class="m"><i>z</i></span>`, ans: z, tol: 0.011 }, { label: `<span class="m"><i>c</i></span>`, ans: cc, tol: 0.012 * sg + 0.01 }],
      solution: `<ol class="steps"><li><span class="m">P(${X_} ≤ <i>c</i>) = ${fmtD(1 - al)}</span>. In der Tafel: <span class="m"><i>F</i><sub>St</sub>(<i>z</i>) = ${fmtD(1 - al)}</span> für <span class="m"><i>z</i> = ${fmt(z, 3)}</span>.</li><li>Zurücktransformieren: <span class="m"><i>c</i> = μ + <i>z</i>σ = ${mu} + ${fmt(z, 3)} · ${sg} = ${fmt(cc, 2)}</span>.</li></ol>`
    };
  }
  const a = Math.round(mu - uni(0.2, 2) * sg), b = Math.round(mu + uni(0.2, 2) * sg);
  if (v === "int") {
    const P = Phi(zs(b)) - Phi(zs(a));
    return {
      prompt: head + `<p>Berechne <span class="m">P(${a} &lt; ${X_} ≤ ${b})</span>.</p>`,
      fields: [{ label: `<span class="m"><i>z</i><sub>a</sub></span>`, ans: zs(a), tol: 0.006 }, { label: `<span class="m"><i>z</i><sub>b</sub></span>`, ans: zs(b), tol: 0.006 }, { label: `<span class="m">P(${a} &lt; ${X_} ≤ ${b})</span>`, ans: P, tol: 0.005 }],
      solution: `<ol class="steps"><li>Erst standardisieren mit <span class="m">σ = ${SQ(sg * sg)} = ${sg}</span>: ${step(a, "a")}, ${step(b, "b")}.</li>
        <li><span class="m">P = <i>F</i><sub>St</sub>(${fmt(zs(b), 2)}) − <i>F</i><sub>St</sub>(${fmt(zs(a), 2)}) = ${fmt(Phi(zs(b)), 4)} − ${fmt(Phi(zs(a)), 4)} = ${fmt(P, 4)}</span></li>
        <li>Für negative z: <span class="m"><i>F</i><sub>St</sub>(−<i>z</i>) = 1 − <i>F</i><sub>St</sub>(<i>z</i>)</span>.</li></ol>`
    };
  }
  const x = v === "right" ? b : a, P = v === "right" ? 1 - Phi(zs(x)) : Phi(zs(x));
  const ev = v === "right" ? `P(${X_} &gt; ${x})` : `P(${X_} ≤ ${x})`;
  return {
    prompt: head + `<p>Berechne <span class="m">${ev}</span>.</p>`,
    fields: [{ label: `<span class="m"><i>z</i></span>`, ans: zs(x), tol: 0.006 }, { label: `<span class="m">${ev}</span>`, ans: P, tol: 0.005 }],
    solution: `<ol class="steps"><li>${step(x, "")} (mit <span class="m">σ = ${SQ(sg * sg)} = ${sg}</span>).</li>
      <li>${v === "right" ? `<span class="m">P(${X_} &gt; ${x}) = 1 − <i>F</i><sub>St</sub>(${fmt(zs(x), 2)}) = 1 − ${fmt(Phi(zs(x)), 4)} = ${fmt(P, 4)}</span>` : `<span class="m">P(${X_} ≤ ${x}) = <i>F</i><sub>St</sub>(${fmt(zs(x), 2)}) = ${fmt(P, 4)}</span>`}</li></ol>`
  };
}

function niceStep(x) { const p = 10 ** Math.floor(Math.log10(x)), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
const decOf = step => (step >= 1 ? 0 : step >= 0.1 ? 1 : 2);
function toolDist(el, id) {

      (D.disc ? `<label class="ctl" for="ds-x"><span><i>x</i> = <output id="ds-xo"></output></span><input type="range" id="ds-x" min="0" max="10" step="1" value="${D.x0}"></label>`
        : `<label class="ctl" for="ds-a"><span>untere Grenze <i>a</i> = <output id="ds-ao"></output></span><input type="range" id="ds-a" min="0" max="1" step="0.0001" value="${D.a0}"></label><label class="ctl" for="ds-b"><span>obere Grenze <i>b</i> = <output id="ds-bo"></output></span><input type="range" id="ds-b" min="0" max="1" step="0.0001" value="${D.b0}"></label>`);

    D.params.forEach(p => { $(`#ds-${p[0]}o`, el).textContent = fmt(P[p[0]], decOf(p[4])); });

    ctx.font = MONO; ctx.textAlign = "center";

    if (D.disc) {

      const xs = []; for (let x = lo; x <= hi; x++) xs.push(x);
      const ps = xs.map(x => D.pmf(x, P)), ymax = Math.max(...ps) * 1.12 || 1;
      const bw = (w - L - R) / xs.length, Y = y => h - B - y / ymax * (h - T - B);
      xs.forEach((x, i) => {

        ctx.fillRect(L + i * bw + bw * 0.14, Y(ps[i]), Math.max(1, bw * 0.72), Y(0) - Y(ps[i]));
      });

    ctx.fillStyle = acc; ctx.globalAlpha = 0.16; ctx.beginPath(); V.forEach((v, i) => (i ? ctx.lineTo(X(v.x), Y(v.y)) : ctx.moveTo(X(v.x), Y(v.y)))); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    A.forEach((r, i) => { ctx.strokeStyle = cssv(cv, cvars[i]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(0), Y(b[i] / r[1])); ctx.lineTo(X(b[i] / r[0]), Y(0)); ctx.stroke(); });
    ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.moveTo(X(0), Y(level / c[1])); ctx.lineTo(X(level / c[0]), Y(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    ctx.strokeStyle = ink; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(X(0), Tp); ctx.lineTo(X(0), Y(0)); ctx.lineTo(w - Rp, Y(0)); ctx.stroke();
    V.forEach(v => { ctx.fillStyle = v === opt ? acc : ink; ctx.beginPath(); ctx.arc(X(v.x), Y(v.y), v === opt ? 6 : 3, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = ink; ctx.textAlign = X(opt.x) > w - 140 ? "right" : "left";
    ctx.fillText(`(${fmt(opt.x, 2)}; ${fmt(opt.y, 2)})  z = ${fmt(opt.z, 1)}`, X(opt.x) + (ctx.textAlign === "left" ? 10 : -10), Y(opt.y) - 10);
    const slack = A.map((r, i) => b[i] - r[0] * opt.x - r[1] * opt.y);
    const marg = A.map((_, i) => { const bb = b.slice(); bb[i] += 1; return lpVert(A, bb, c).opt.z - opt.z; });
    $("#lp-out", el).innerHTML = `Optimum <span class="m">(<i>x</i><sub>1</sub>; <i>x</i><sub>2</sub>) = (${fmt(opt.x, 2)}; ${fmt(opt.y, 2)})</span>, <span class="m"><i>z</i>* = ${fmt(opt.z, 2)}</span>. ${level > opt.z + 1e-6 ? "Die Höhenlinie hat keinen Punkt mehr mit der zulässigen Menge gemeinsam." : ""}<br>
      Übrig: ${names.map((n, i) => `${n} ${fmt(Math.max(0, slack[i]), 2)}`).join(" · ")}<br>Grenzgewinn je zusätzlichem kg: ${names.map((n, i) => `${n} ${fmt(marg[i], 2)}`).join(" · ")}`;
  }
  el.querySelectorAll("input").forEach(i => i.addEventListener("input", draw));
  watch(cv, draw); draw();
}

/* ---------- Theorie nach den Skripten ---------- */
const Fx = "<i>f</i>(<i>x</i>)", xi = "<i>x<sub>i</sub></i>";
TH.zv = `
  <p>Eine Zufallsvariable ${X_} ordnet jedem Elementarereignis <i>e</i> eine reelle Zahl ${X_}(<i>e</i>) zu. Sie heißt <b>diskret</b>, wenn ihr Wertevorrat endlich oder abzählbar unendlich ist, und <b>stetig</b>, wenn er aus der reellen Achse oder Teilintervallen besteht.</p>
  <div class="tbl-wrap"><table class="qt"><thead><tr><th></th><th>diskret</th><th>stetig</th></tr></thead><tbody>
    <tr><td class="txt">Funktion</td><td>Massenfunktion ${Fx} = P(${X_} = <i>x</i>)</td><td>Dichtefunktion ${Fx} = <i>F</i>′(<i>x</i>)</td></tr>
    <tr><td class="txt">Normierung</td><td>Σ <i>f</i>(${xi}) = 1</td><td>∫ ${Fx} d<i>x</i> = 1</td></tr>
    <tr><td class="txt">Verteilungsfunktion</td><td><i>F</i>(<i>x</i>) = Σ<sub>${xi} ≤ <i>x</i></sub> <i>f</i>(${xi})</td><td>P(<i>a</i> ≤ ${X_} ≤ <i>b</i>) = <i>F</i>(<i>b</i>) − <i>F</i>(<i>a</i>)</td></tr>
    <tr><td class="txt">Erwartungswert</td><td>E(${X_}) = Σ <i>x<sub>j</sub></i> <i>f</i>(<i>x<sub>j</sub></i>)</td><td>E(${X_}) = ∫ <i>x</i> ${Fx} d<i>x</i></td></tr>
    <tr><td class="txt">Varianz</td><td>Σ (<i>x<sub>j</sub></i> − μ)² <i>f</i>(<i>x<sub>j</sub></i>)</td><td>∫ (<i>x</i> − μ)² ${Fx} d<i>x</i></td></tr></tbody></table></div>
  <div class="f">Var(${X_}) = E(${X_}²) − μ²<span class="lbl">vereinfachte Berechnung</span></div>
  <ul class="keys">
    <li><b>Verteilungsfunktion</b> <i>F</i>(<i>x</i>) = P(${X_} ≤ <i>x</i>): monoton steigend, rechtsseitig stetig, Grenzwerte 0 und 1. Bei diskreten Zufallsvariablen ist sie eine Treppenfunktion.</li>
    <li>Die Standardabweichung ist <span class="m">σ = +√Var(${X_})</span>. E(${X_}) heißt Lageparameter, Var(${X_}) Streuungsparameter.</li>
  </ul>`;
TH.trafo = `
  <h4>Erwartungswert</h4>
  <div class="f">E(<i>a</i>) = <i>a</i> &nbsp;&nbsp; E(<i>a</i> + <i>b</i>${X_}) = <i>a</i> + <i>b</i>·E(${X_}) &nbsp;&nbsp; E[<i>g</i><sub>1</sub>(${X_}) + <i>g</i><sub>2</sub>(${X_})] = E[<i>g</i><sub>1</sub>(${X_})] + E[<i>g</i><sub>2</sub>(${X_})]</div>
  <h4>Varianz</h4>
  <div class="f">Var(<i>a</i>) = 0 &nbsp;&nbsp; Var(${X_} + <i>a</i>) = Var(${X_}) &nbsp;&nbsp; Var(<i>a</i> + <i>b</i>${X_}) = <i>b</i>²·Var(${X_}) &nbsp;&nbsp; σ<sub><i>a</i>+<i>bX</i></sub> = |<i>b</i>|·σ<sub><i>X</i></sub></div>
  <h4>Steinerscher Satz (Verschiebungssatz)</h4>
  <div class="f">Var(${X_}) = E[(${X_} − <i>d</i>)²] − (μ − <i>d</i>)²<span class="lbl">mit d = 0: Var(X) = E(X²) − μ²</span></div>
  <h4>Standardisieren</h4>
  <div class="f"><i>Z</i> = ${F(`${X_} − μ`, "σ")} &nbsp; ⇒ &nbsp; E(<i>Z</i>) = 0, &nbsp; Var(<i>Z</i>) = 1</div>
  <ul class="keys"><li>Erst um μ verschieben (Mittelwert 0), dann mit dem Faktor 1/σ strecken (Varianz 1).</li><li>Der z-Wert sagt, um wie viele Standardabweichungen ein Wert vom Erwartungswert abweicht.</li></ul>`;
TH.tsch = `
  <p>Für <b>jede</b> Zufallsvariable mit Erwartungswert μ und Standardabweichung σ gilt, völlig unabhängig von der Verteilung, für jedes <i>k</i> &gt; 0:</p>
  <div class="f">P(|${X_} − μ| ≥ <i>k</i>σ) ≤ ${F(1, "<i>k</i>²")} &nbsp;&nbsp; bzw. &nbsp;&nbsp; P(μ − <i>k</i>σ &lt; ${X_} &lt; μ + <i>k</i>σ) ≥ 1 − ${F(1, "<i>k</i>²")}</div>
  <div class="tbl-wrap"><table class="qt"><thead><tr><th><i>k</i></th><th>außerhalb höchstens</th><th>innerhalb mindestens</th></tr></thead><tbody>
    <tr><td>1,5</td><td>0,444</td><td>0,556</td></tr><tr><td>2</td><td>0,25</td><td>0,75</td></tr><tr><td>2,5</td><td>0,16</td><td>0,84</td></tr><tr><td>3</td><td>0,111</td><td>0,889</td></tr></tbody></table></div>
  <ol class="steps"><li>Abstand <i>c</i> der Intervallgrenzen vom Erwartungswert bestimmen.</li><li><span class="m"><i>k</i> = <i>c</i>/σ</span> mit <span class="m">σ = √Var(${X_})</span>.</li><li>Schranke <span class="m">1/<i>k</i>²</span> bzw. <span class="m">1 − 1/<i>k</i>²</span> berechnen.</li></ol>
  <ul class="keys"><li>Für <i>k</i> ≤ 1 ist die Aussage trivial.</li><li>Bei diskreten Werten zuerst die Grenzen umschreiben. Skriptbeispiel: <span class="m">${X_} &lt; 3</span> oder <span class="m">${X_} &gt; 6</span> wird zu <span class="m">${X_} ≤ 2</span> oder <span class="m">${X_} ≥ 7</span>, also <span class="m">|${X_} − 4,5| ≥ 2,5</span>.</li></ul>`;
TH.kombi = `
  <div class="f"><i>n</i>! = 1 · 2 · … · <i>n</i>, &nbsp; 0! = 1 &nbsp;&nbsp;&nbsp; ${BC("<i>n</i>", "<i>k</i>")} = ${F("<i>n</i>!", "<i>k</i>! (<i>n</i> − <i>k</i>)!")}</div>
  <div class="tbl-wrap"><table class="qt"><thead><tr><th>Fragestellung</th><th>Anzahl</th></tr></thead><tbody>
    <tr><td class="txt">Permutationen: alle <i>n</i> verschiedenen Elemente anordnen</td><td><sub><i>n</i></sub><i>P</i> = <i>n</i>!</td></tr>
    <tr><td class="txt">Kombinationen <i>k</i>-ter Ordnung <b>mit</b> Berücksichtigung der Anordnung</td><td><sub><i>n</i></sub><i>V</i><sub><i>k</i></sub> = ${F("<i>n</i>!", "(<i>n</i> − <i>k</i>)!")}</td></tr>
    <tr><td class="txt">Kombinationen <i>k</i>-ter Ordnung <b>ohne</b> Berücksichtigung der Anordnung</td><td><sub><i>n</i></sub><i>C</i><sub><i>k</i></sub> = ${BC("<i>n</i>", "<i>k</i>")}</td></tr></tbody></table></div>
  <ul class="keys">
    <li>Medaillen bei 8 Sprintern: <span class="m"><sub>8</sub><i>V</i><sub>3</sub> = 8 · 7 · 6 = 336</span>.</li>
    <li>Lotto: <span class="m">${BC(49, 6)} = 13 983 816</span>. Genau 4 Richtige: <span class="m">${BC(6, 4)} · ${BC(43, 2)} = 15 · 903 = 13 545</span>.</li>
    <li>Im Pascal'schen Dreieck ist jede Zahl die Summe der beiden darüber.</li>
  </ul>`;
TH.binom = `
  <h4>Bernoulli-Verteilung</h4>
  <p>Ein Experiment mit „Erfolg“ (Wahrscheinlichkeit <i>p</i>) oder „Misserfolg“ (<i>q</i> = 1 − <i>p</i>).</p>
  <div class="f"><i>f</i><sub>Be</sub>(1; <i>p</i>) = <i>p</i>, &nbsp; <i>f</i><sub>Be</sub>(0; <i>p</i>) = 1 − <i>p</i> &nbsp;&nbsp; E(${X_}) = <i>p</i> &nbsp;&nbsp; Var(${X_}) = <i>p</i><i>q</i></div>
  <h4>Binomialverteilung</h4>
  <p><i>n</i> unabhängige Bernoulli-Experimente mit gleichem <i>p</i> (Urnenmodell <b>mit</b> Zurücklegen). ${X_} zählt die Erfolge.</p>
  <div class="f"><i>f</i><sub>Bi</sub>(<i>x</i>; <i>p</i>, <i>n</i>) = ${BC("<i>n</i>", "<i>x</i>")} <i>p</i><sup><i>x</i></sup> (1 − <i>p</i>)<sup><i>n</i>−<i>x</i></sup>, &nbsp; <i>x</i> = 0, 1, …, <i>n</i></div>
  <div class="f">E(${X_}) = <i>n</i><i>p</i> &nbsp;&nbsp; Var(${X_}) = <i>n</i><i>p</i>(1 − <i>p</i>)</div>
  <ul class="keys"><li>Zwei-Parameter-Familie. Symmetrisch für <i>p</i> = 1/2, linkssteil für <i>p</i> &lt; 1/2, rechtssteil für <i>p</i> &gt; 1/2.</li><li><span class="m">P(${X_} ≤ <i>x</i>)</span> ist die Summe der Einzelwahrscheinlichkeiten. Für „mindestens eins“ hilft die Gegenwahrscheinlichkeit <span class="m">1 − P(${X_} = 0)</span>.</li></ul>`;
TH.hyper = `
  <p>Urnenmodell <b>ohne</b> Zurücklegen: <i>N</i> Kugeln, davon <i>S</i> schwarz, Stichprobe vom Umfang <i>n</i>. ${X_} ist die Anzahl schwarzer Kugeln.</p>
  <div class="f"><i>f</i><sub>Hy</sub>(<i>x</i>; <i>N</i>, <i>S</i>, <i>n</i>) = ${F(`${BC("<i>S</i>", "<i>x</i>")} · ${BC("<i>N</i> − <i>S</i>", "<i>n</i> − <i>x</i>")}`, BC("<i>N</i>", "<i>n</i>"))}</div>
  <div class="f">E(${X_}) = <i>n</i><i>p</i> mit <i>p</i> = <i>S</i>/<i>N</i> &nbsp;&nbsp; Var(${X_}) = <i>n</i><i>p</i>(1 − <i>p</i>) · ${F("<i>N</i> − <i>n</i>", "<i>N</i> − 1")}</div>
  <ul class="keys"><li>Der <b>Korrekturfaktor</b> <span class="m"><i>K<sub>f</sub></i> = (<i>N</i> − <i>n</i>)/(<i>N</i> − 1) ≤ 1</span> macht die Varianz kleiner als bei der Binomialverteilung.</li><li>Drei-Parameter-Familie. Für <i>N</i> → ∞ geht <i>K<sub>f</sub></i> → 1 und die hypergeometrische in die Binomialverteilung über.</li><li>Ohne Zurücklegen sind die Ziehungen nicht unabhängig.</li></ul>`;
TH.pois = `
  <p>Zahl der Erfolge bei sehr vielen Bernoulli-Experimenten (<i>n</i> → ∞) mit sehr kleiner Erfolgswahrscheinlichkeit (<i>p</i> → 0), wobei <span class="m"><i>n</i><i>p</i> → λ</span>.</p>
  <div class="f"><i>f</i><sub>Po</sub>(<i>x</i>; λ) = ${F("λ<sup><i>x</i></sup>", "<i>x</i>!")} <i>e</i><sup>−λ</sup>, &nbsp; <i>x</i> = 0, 1, 2, … &nbsp;&nbsp; E(${X_}) = Var(${X_}) = λ</div>
  <ul class="keys">
    <li><b>Näherung:</b> <span class="m"><i>f</i><sub>Bi</sub>(<i>x</i>; <i>p</i>, <i>n</i>) ≈ <i>f</i><sub>Po</sub>(<i>x</i>; λ = <i>n</i><i>p</i>)</span> für großes <i>n</i> und kleines <i>p</i>. Roulette, 200 Spiele auf die 17: λ = 200/37 = 5,4054 und P(${X_} = 8) ≈ 0,0812 (exakt binomial 0,0814).</li>
    <li>Anwendungen: Bestellungen pro Tag, Kreditausfälle. 1000 Kredite mit je 1 % Ausfallwahrscheinlichkeit ergeben λ = 10.</li>
    <li><span class="m">P(${X_} ≥ <i>k</i>) = 1 − P(${X_} ≤ <i>k</i> − 1)</span>.</li></ul>`;
TH.geo = `
  <p>Ein Bernoulli-Experiment wird so oft ausgeführt, bis zum ersten Mal Erfolg eintritt. ${X_} ist die Anzahl der <b>vorausgegangenen Misserfolge</b>.</p>
  <div class="f"><i>f</i><sub>Geo</sub>(<i>x</i>; <i>p</i>) = (1 − <i>p</i>)<sup><i>x</i></sup> <i>p</i>, &nbsp; <i>x</i> = 0, 1, 2, … &nbsp;&nbsp; <i>F</i><sub>Geo</sub>(<i>x</i>; <i>p</i>) = 1 − (1 − <i>p</i>)<sup><i>x</i>+1</sup></div>
  <div class="f">E(${X_}) = ${F("1 − <i>p</i>", "<i>p</i>")} &nbsp;&nbsp; Var(${X_}) = ${F("1 − <i>p</i>", "<i>p</i>²")}</div>
  <ul class="keys"><li>Taxi-Beispiel aus dem Skript mit <i>p</i> = 0,2: E(${X_}) = 0,8/0,2 = 4 Minuten, σ = √20 ≈ 4,472, P(${X_} &gt; 5) = 1 − <i>F</i>(5) = 0,2622.</li><li>Achtung: Manche Lehrbücher zählen die Versuche einschließlich des Erfolgs (dann E = 1/<i>p</i>). Die App verwendet die Definition aus deinem Skript.</li></ul>`;
TH.stetig = `
  <h4>Rechteckverteilung auf [<i>a</i>, <i>b</i>]</h4>
  <div class="f"><i>f</i><sub>R</sub>(<i>x</i>) = ${F(1, "<i>b</i> − <i>a</i>")} für <i>a</i> ≤ <i>x</i> ≤ <i>b</i>, sonst 0 &nbsp;&nbsp; E(${X_}) = ${F("<i>a</i> + <i>b</i>", 2)} &nbsp;&nbsp; Var(${X_}) = ${F("(<i>b</i> − <i>a</i>)²", 12)}</div>
  <p>Stetige Version der diskreten Gleichverteilung. Bus alle 30 Minuten: P(<i>T</i> &gt; 10) = 1 − 10/30 = 2/3, E(<i>T</i>) = 15, σ = 8,6603.</p>
  <h4>Exponentialverteilung</h4>
  <div class="f"><i>f</i><sub>Ex</sub>(<i>x</i>; λ) = λ<i>e</i><sup>−λ<i>x</i></sup>, <i>x</i> ≥ 0 &nbsp;&nbsp; <i>F</i><sub>Ex</sub>(<i>x</i>; λ) = 1 − <i>e</i><sup>−λ<i>x</i></sup> &nbsp;&nbsp; E(${X_}) = 1/λ &nbsp;&nbsp; Var(${X_}) = 1/λ²</div>
  <ul class="keys"><li>Stetiges Pendant der geometrischen Verteilung, z. B. für Lebensdauern. Mit μ = 1/λ: <span class="m"><i>f</i>(<i>x</i>) = (1/μ) <i>e</i><sup>−<i>x</i>/μ</sup></span>.</li><li>Glühbirne mit μ = 5000 h: P(${X_} &lt; 2500) = 1 − <i>e</i><sup>−0,5</sup> = 0,3935 und P(${X_} &gt; 10 000) = <i>e</i><sup>−2</sup> = 0,1353.</li></ul>`;
TH.normal = `
  <h4>Standardnormalverteilung</h4>
  <div class="f"><i>f</i><sub>St</sub>(<i>z</i>) = ${F(1, SQ("2π"))} <i>e</i><sup>−<i>z</i>²/2</sup> &nbsp;&nbsp; E(<i>Z</i>) = 0, Var(<i>Z</i>) = 1</div>
  <p>Glockenkurve mit Maximum bei <i>z</i> = 0 und Wendepunkten bei ±1. Die Verteilungsfunktion <i>F</i><sub>St</sub>(<i>z</i>) ist nicht elementar und steht in Tabellen.</p>
  <div class="tbl-wrap"><table class="qt"><tbody>
    <tr><td><i>F</i><sub>St</sub>(0) = 0,5</td><td><i>F</i><sub>St</sub>(1) = 0,8413</td><td><i>F</i><sub>St</sub>(1,8) = 0,9641</td></tr>
    <tr><td><i>D</i>(1) = 0,6826</td><td><i>D</i>(2) = 0,9544</td><td><i>D</i>(1,96) = 0,95</td></tr></tbody></table></div>
  <h4>Allgemeine Normalverteilung</h4>
  <div class="f"><i>F</i><sub>N</sub>(<i>x</i>) = <i>F</i><sub>St</sub>(${F("<i>x</i> − μ", "σ")}) &nbsp;&nbsp; P(<i>a</i> &lt; ${X_} ≤ <i>b</i>) = <i>F</i><sub>St</sub>(${F("<i>b</i> − μ", "σ")}) − <i>F</i><sub>St</sub>(${F("<i>a</i> − μ", "σ")})</div>
  <ul class="keys">
    <li>Symmetrie: <span class="m"><i>F</i><sub>St</sub>(−<i>z</i>) = 1 − <i>F</i><sub>St</sub>(<i>z</i>)</span>, und <span class="m"><i>D</i>(<i>z</i>) = P(−<i>z</i> &lt; <i>Z</i> ≤ <i>z</i>) = 2<i>F</i><sub>St</sub>(<i>z</i>) − 1</span>.</li>
    <li>Skriptbeispiel E(${X_}) = 5, Var(${X_}) = 9: P(4 &lt; ${X_} ≤ 7) = <i>F</i><sub>St</sub>(2/3) − <i>F</i><sub>St</sub>(−1/3) = 0,7475 − 0,3694 = 0,3781.</li>
    <li>Achtung: Ist die Varianz gegeben, zuerst σ = √Var berechnen.</li>
    <li>Lognormalverteilung: ln ${X_} ist normalverteilt. Sie ist rechtsschief und modelliert z. B. aggregierte Kreditverluste.</li></ul>`;
TH.vek = `
  <p>Ein Vektor beschreibt eine Bewegung. Von <i>P</i> = (<i>p</i><sub>1</sub>, <i>p</i><sub>2</sub>) nach <i>Q</i> = (<i>q</i><sub>1</sub>, <i>q</i><sub>2</sub>) gilt <span class="m"><i>a</i> = (<i>q</i><sub>1</sub> − <i>p</i><sub>1</sub>, <i>q</i><sub>2</sub> − <i>p</i><sub>2</sub>)</span>. Die Summe <i>a</i> + <i>b</i> ist die Diagonale im Parallelogramm, <i>t</i><i>a</i> ist eine Umskalierung.</p>
  <h4>Inneres Produkt (Skalarprodukt)</h4>
  <div class="f"><i>a</i> · <i>b</i> = <i>a</i><sub>1</sub><i>b</i><sub>1</sub> + <i>a</i><sub>2</sub><i>b</i><sub>2</sub> + … + <i>a<sub>n</sub></i><i>b<sub>n</sub></i> = Σ <i>a<sub>i</sub></i><i>b<sub>i</sub></i></div>
  <h4>Länge (Norm)</h4>
  <div class="f">‖<i>a</i>‖ = ${SQ("<i>a</i><sub>1</sub>² + … + <i>a<sub>n</sub></i>²")} = ${SQ("<i>a</i> · <i>a</i>")}</div>
  <ul class="keys">
    <li>Das innere Produkt ist eine Zahl (Skalar) und nur für Vektoren gleicher Dimension definiert.</li>
    <li>Regeln: <span class="m"><i>a</i>·<i>b</i> = <i>b</i>·<i>a</i></span>, <span class="m"><i>a</i>·(<i>b</i> + <i>c</i>) = <i>a</i>·<i>b</i> + <i>a</i>·<i>c</i></span>, <span class="m">(α<i>a</i>)·<i>b</i> = α(<i>a</i>·<i>b</i>)</span>, <span class="m"><i>a</i>·<i>a</i> &gt; 0 ⇔ <i>a</i> ≠ 0</span>.</li>
    <li><b>Orthogonal:</b> <span class="m"><i>a</i> ⊥ <i>b</i> ⇔ <i>a</i> · <i>b</i> = 0</span> (folgt aus dem Satz des Pythagoras).</li>
    <li><b>Cauchy-Schwarz:</b> <span class="m">|<i>a</i> · <i>b</i>| ≤ ‖<i>a</i>‖ · ‖<i>b</i>‖</span>.</li>
    <li>Ökonomisch: Preisvektor · Warenvektor = Gesamtwarenwert, z. B. (4, 5, 3, 8) · (5, 3, 6, 7) = 109.</li></ul>`;
TH.matops = `
  <p>Eine <i>m</i> × <i>n</i>-Matrix <span class="m"><i>A</i> = (<i>a<sub>ij</sub></i>)<sub><i>m</i>×<i>n</i></sub></span> hat <i>m</i> Zeilen und <i>n</i> Spalten. <i>a<sub>ij</sub></i> steht in Zeile <i>i</i> und Spalte <i>j</i>. Ist <i>m</i> = <i>n</i>, heißt sie quadratisch, und <i>a</i><sub>11</sub>, …, <i>a<sub>nn</sub></i> bilden die Hauptdiagonale.</p>
  <div class="f"><i>A</i> + <i>B</i> = (<i>a<sub>ij</sub></i> + <i>b<sub>ij</sub></i>) &nbsp;&nbsp; α<i>A</i> = (α<i>a<sub>ij</sub></i>) &nbsp;&nbsp; <i>A</i>′ = (<i>a</i>′<sub><i>ij</i></sub>) mit <i>a</i>′<sub><i>ij</i></sub> = <i>a<sub>ji</sub></i></div>
  <ul class="keys">
    <li>Addieren nur bei gleicher Ordnung. Es gelten Assoziativ- und Kommutativgesetz, <span class="m"><i>A</i> + 0 = <i>A</i></span>, <span class="m">(α + β)<i>A</i> = α<i>A</i> + β<i>A</i></span>, <span class="m">α(<i>A</i> + <i>B</i>) = α<i>A</i> + α<i>B</i></span>.</li>
    <li><b>Transponieren:</b> Jede Zeile von <i>A</i> wird eine Spalte von <i>A</i>′. Regeln: <span class="m">(<i>A</i>′)′ = <i>A</i></span>, <span class="m">(<i>A</i> + <i>B</i>)′ = <i>A</i>′ + <i>B</i>′</span>, <span class="m">(α<i>A</i>)′ = α<i>A</i>′</span>, <span class="m">(<i>A</i><i>B</i>)′ = <i>B</i>′<i>A</i>′</span>.</li>
    <li><b>Symmetrisch</b> heißt <span class="m"><i>A</i> = <i>A</i>′</span>, also <span class="m"><i>a<sub>ij</sub></i> = <i>a<sub>ji</sub></i></span>.</li>
    <li>Für einen Spaltenvektor gilt <span class="m"><i>x</i>′<i>x</i> = ‖<i>x</i>‖²</span>, während <i>x</i><i>x</i>′ eine <i>n</i> × <i>n</i>-Matrix ist.</li></ul>`;
TH.mm = `
  <p>Das Produkt <span class="m"><i>C</i> = <i>A</i><i>B</i></span> existiert nur, wenn <i>A</i> so viele Spalten hat wie <i>B</i> Zeilen: <span class="m">(<i>m</i> × <i>n</i>) · (<i>n</i> × <i>p</i>) = (<i>m</i> × <i>p</i>)</span>.</p>
  <div class="f"><i>c<sub>ij</sub></i> = Σ<sub><i>r</i>=1</sub><sup><i>n</i></sup> <i>a<sub>ir</sub></i> <i>b<sub>rj</sub></i><span class="lbl">inneres Produkt der i-ten Zeile von A mit der j-ten Spalte von B</span></div>
  <ul class="keys">
    <li><b>AB = BA gilt im Allgemeinen nicht!</b> Ist A 6 × 3 und B 3 × 5, ist AB definiert, BA nicht.</li>
    <li>Es gelten <span class="m">(<i>A</i><i>B</i>)<i>C</i> = <i>A</i>(<i>B</i><i>C</i>)</span>, <span class="m"><i>A</i>(<i>B</i> + <i>C</i>) = <i>A</i><i>B</i> + <i>A</i><i>C</i></span>, <span class="m">(<i>A</i> + <i>B</i>)<i>C</i> = <i>A</i><i>C</i> + <i>B</i><i>C</i></span>.</li>
    <li>Regeln, die <b>nicht</b> gelten: <span class="m"><i>A</i><i>B</i> = 0</span> erzwingt nicht <i>A</i> = 0 oder <i>B</i> = 0; aus <span class="m"><i>A</i><i>B</i> = <i>A</i><i>C</i></span> folgt nicht <i>B</i> = <i>C</i>. <span class="m"><i>A</i><i>A</i> + <i>A</i><i>B</i> + <i>B</i><i>A</i> + <i>B</i><i>B</i></span> ist nicht <span class="m"><i>A</i><i>A</i> + 2<i>A</i><i>B</i> + <i>B</i><i>B</i></span>.</li>
    <li>Einheitsmatrix <i>I<sub>n</sub></i>: <span class="m"><i>A</i><i>I<sub>n</sub></i> = <i>I<sub>n</sub></i><i>A</i> = <i>A</i></span>. Potenzen: <span class="m"><i>A</i><sup><i>n</i></sup> = <i>A</i><i>A</i>…<i>A</i></span>.</li>
    <li>Anwendungen: Marktanteile nach einem Jahr <span class="m"><i>T</i><i>s</i></span>, Rohstoffbedarf <span class="m"><i>r</i> = <i>A</i><i>u</i></span>, Kosten <span class="m"><i>K</i> = <i>p</i><i>A</i><i>u</i></span>, Flugverbindungen <span class="m"><i>R</i> = <i>P</i><i>Q</i></span>.</li></ul>`;
TH.det = `
  <h4>Ordnung 2</h4>
  <div class="f">|<i>A</i>| = det${matHTML([["<i>a</i><sub>11</sub>", "<i>a</i><sub>12</sub>"], ["<i>a</i><sub>21</sub>", "<i>a</i><sub>22</sub>"]])} = <i>a</i><sub>11</sub><i>a</i><sub>22</sub> − <i>a</i><sub>12</sub><i>a</i><sub>21</sub></div>
  <h4>Ordnung 3: Entwicklung nach Co-Faktoren (erste Zeile)</h4>
  <div class="f">|<i>A</i>| = <i>a</i><sub>11</sub>·|<i>A</i><sub>11</sub>| <b>−</b> <i>a</i><sub>12</sub>·|<i>A</i><sub>12</sub>| + <i>a</i><sub>13</sub>·|<i>A</i><sub>13</sub>|</div>
  <p><i>A</i><sub>1<i>j</i></sub> entsteht durch Streichen der ersten Zeile und der <i>j</i>-ten Spalte. Achtung beim Minus vor <i>a</i><sub>12</sub>. Skriptbeispiel: <span class="m">${matHTML([[3, 0, 2], [-1, 1, 0], [5, 2, 3]])}</span> hat |A| = 3·3 − 0 + 2·(−2 − 5) = −5.</p>
  <h4>Regeln für eine <i>n</i> × <i>n</i>-Matrix</h4>
  <ol class="steps">
    <li>Eine Zeile oder Spalte nur aus Nullen: |<i>A</i>| = 0.</li>
    <li>|<i>A</i>′| = |<i>A</i>|.</li>
    <li>Eine Zeile mit α multiplizieren: Die Determinante wird mit α multipliziert.</li>
    <li>Zwei Zeilen vertauschen: Vorzeichenwechsel.</li>
    <li>Zwei Zeilen proportional: |<i>A</i>| = 0.</li>
    <li>Vielfaches einer Zeile zu einer anderen addieren: unverändert.</li>
    <li>|<i>A</i><i>B</i>| = |<i>A</i>| · |<i>B</i>|.</li>
    <li>|α<i>A</i>| = α<sup><i>n</i></sup>|<i>A</i>|.</li></ol>`;
TH.cramer = `
  <p>Für <span class="m"><i>a</i><sub>11</sub><i>x</i><sub>1</sub> + <i>a</i><sub>12</sub><i>x</i><sub>2</sub> = <i>b</i><sub>1</sub></span>, <span class="m"><i>a</i><sub>21</sub><i>x</i><sub>1</sub> + <i>a</i><sub>22</sub><i>x</i><sub>2</sub> = <i>b</i><sub>2</sub></span> mit <span class="m">|<i>A</i>| ≠ 0</span> gilt:</p>
  <div class="f"><i>x</i><sub>1</sub> = ${F(`det${matHTML([["<i>b</i><sub>1</sub>", "<i>a</i><sub>12</sub>"], ["<i>b</i><sub>2</sub>", "<i>a</i><sub>22</sub>"]])}`, "|<i>A</i>|")} &nbsp;&nbsp; <i>x</i><sub>2</sub> = ${F(`det${matHTML([["<i>a</i><sub>11</sub>", "<i>b</i><sub>1</sub>"], ["<i>a</i><sub>21</sub>", "<i>b</i><sub>2</sub>"]])}`, "|<i>A</i>|")}</div>
  <ul class="keys"><li>Achte darauf, wo der Vektor der rechten Seite steht: Für <i>x<sub>j</sub></i> ersetzt er die <i>j</i>-te Spalte.</li>
    <li>Geometrisch ist jede Gleichung eine Gerade. Bei |<i>A</i>| ≠ 0 schneiden sie sich in genau einem Punkt. Bei |<i>A</i>| = 0 sind sie parallel (keine Lösung) oder fallen zusammen (unendlich viele).</li>
    <li>Skriptaufgabe: 2<i>x</i><sub>1</sub> + 4<i>x</i><sub>2</sub> = 7, 2<i>x</i><sub>1</sub> − 2<i>x</i><sub>2</sub> = −2 ergibt <i>x</i><sub>1</sub> = 1/2, <i>x</i><sub>2</sub> = 3/2.</li></ul>`;
TH.inv = `
  <p><i>X</i> heißt Inverse von <i>A</i>, wenn <span class="m"><i>A</i><i>X</i> = <i>X</i><i>A</i> = <i>I</i></span>. Nur quadratische Matrizen können eine Inverse haben, aber nicht jede hat eine.</p>
  <ul class="keys"><li><b>Existenz:</b> <i>A</i> hat genau dann eine Inverse, wenn <span class="m">|<i>A</i>| ≠ 0</span> (nichtsingulär). Bei |<i>A</i>| = 0 heißt <i>A</i> singulär.</li>
    <li><b>Eindeutigkeit:</b> Es gibt höchstens eine Inverse <i>A</i><sup>−1</sup>. Das Symbol <i>I</i>/<i>A</i> hat keine Bedeutung.</li></ul>
  <h4>2 × 2-Formel</h4>
  <div class="f">${matHTML([["<i>a</i>", "<i>b</i>"], ["<i>c</i>", "<i>d</i>"]])}<sup>−1</sup> = ${F(1, "<i>a</i><i>d</i> − <i>b</i><i>c</i>")} ${matHTML([["<i>d</i>", "−<i>b</i>"], ["−<i>c</i>", "<i>a</i>"]])}</div>
  <h4>Eigenschaften und Gleichungen</h4>
  <div class="f">(<i>A</i><sup>−1</sup>)<sup>−1</sup> = <i>A</i> &nbsp; (<i>A</i><i>B</i>)<sup>−1</sup> = <i>B</i><sup>−1</sup><i>A</i><sup>−1</sup> &nbsp; (<i>A</i>′)<sup>−1</sup> = (<i>A</i><sup>−1</sup>)′ &nbsp; (<i>c</i><i>A</i>)<sup>−1</sup> = <i>c</i><sup>−1</sup><i>A</i><sup>−1</sup></div>
  <div class="f"><i>A</i><i>X</i> = <i>B</i> ⇔ <i>X</i> = <i>A</i><sup>−1</sup><i>B</i> &nbsp;&nbsp; <i>Y</i><i>A</i> = <i>B</i> ⇔ <i>Y</i> = <i>B</i><i>A</i><sup>−1</sup></div>
  <p>Achtung: <i>A</i><sup>−1</sup><i>B</i> ist im Allgemeinen verschieden von <i>B</i><i>A</i><sup>−1</sup>.</p>`;
TH.lgs = `
  <p>Die erweiterte Koeffizientenmatrix <span class="m">(<i>A</i> | <i>b</i>)</span> wird mit elementaren Zeilenoperationen umgeformt. Das Zeichen ~ bedeutet: Die Lösungsmenge bleibt gleich.</p>
  <ol class="steps"><li>Vertauschen eines Paares von Zeilen.</li><li>Multiplizieren einer Zeile mit einem Skalar ≠ 0.</li><li>Addieren eines Vielfachen einer Zeile zu einer anderen Zeile.</li></ol>
  <h4>Gauß'sches Eliminationsverfahren (Gauß-Jordan)</h4>
  <ol class="steps"><li>Treppenstufenform erzeugen, mit 1 als Koeffizient jedes führenden Eintrags.</li><li>Nullen über jedem führenden Eintrag erzeugen.</li><li>Führende Unbekannte durch die nicht führenden ausdrücken. Letztere sind frei wählbar. Ihre Anzahl ist die Zahl der <b>Freiheitsgrade</b>.</li></ol>
  <ul class="keys"><li>Eine Zeile <span class="m">0 … 0 | <i>c</i></span> mit <i>c</i> ≠ 0 zeigt: Das System ist inkonsistent und hat keine Lösung.</li><li>In den Lösungswegen der App stehen römische Ziffern für die Zeilen, z. B. <code>(ii) − 2·(i)</code>.</li></ul>`;
TH.lpgraf = `
  <p>Ein LP-Problem maximiert oder minimiert eine lineare Zielfunktion unter linearen Nebenbedingungen und Nichtnegativitätsbedingungen.</p>
  <div class="f">max <i>z</i> = <i>c</i><sub>1</sub><i>x</i><sub>1</sub> + … + <i>c<sub>n</sub></i><i>x<sub>n</sub></i> &nbsp; unter &nbsp; <i>a</i><sub><i>i</i>1</sub><i>x</i><sub>1</sub> + … + <i>a<sub>in</sub></i><i>x<sub>n</sub></i> ≤ <i>b<sub>i</sub></i>, &nbsp; <i>x<sub>j</sub></i> ≥ 0</div>
  <p><b>Kuchenproblem des Bäckers:</b> max 20<i>x</i><sub>1</sub> + 30<i>x</i><sub>2</sub> unter 3<i>x</i><sub>1</sub> + 6<i>x</i><sub>2</sub> ≤ 150 (Mehl), <i>x</i><sub>1</sub> + 0,5<i>x</i><sub>2</sub> ≤ 22 (Zucker), <i>x</i><sub>1</sub> + <i>x</i><sub>2</sub> ≤ 27,5 (Butter). Optimum (5; 22,5) mit Gewinn 775. Vom Zucker bleiben 5,75 kg übrig.</p>
  <ol class="steps"><li>Begrenzungsgeraden einzeichnen. Die zulässige Menge liegt auf oder unterhalb aller Geraden im 1. Quadranten.</li><li>Höhenlinien <span class="m"><i>c</i><sub>1</sub><i>x</i><sub>1</sub> + <i>c</i><sub>2</sub><i>x</i><sub>2</sub> = <i>c</i></span> sind parallel mit Steigung −<i>c</i><sub>1</sub>/<i>c</i><sub>2</sub>.</li><li>Die Höhenlinie so weit nach Nordosten schieben, bis sie die zulässige Menge gerade noch berührt.</li><li>Den Berührpunkt als Schnittpunkt zweier Geraden berechnen.</li></ol>
  <ul class="keys"><li>Hat ein LP-Problem eine Lösung, liegt sie in einem <b>Eckpunkt</b>. Alternativ: alle Eckpunkte berechnen und vergleichen.</li><li>Eine Bedingung „≥“ lässt sich durch Multiplikation mit −1 in „≤“ umschreiben. Bei Minimierung (Kostenproblem) liegt die zulässige Menge oft im Nordosten.</li></ul>`;
TH.simplex = `
  <p>Mit Schlupfvariablen werden aus den Ungleichungen Gleichungen. <i>y<sub>i</sub></i> misst, wie viel von Ressource <i>i</i> ungenutzt bleibt.</p>
  <div class="f"><i>z</i> − 20<i>x</i><sub>1</sub> − 30<i>x</i><sub>2</sub> = 0, &nbsp; <i>y</i><sub>1</sub> + 3<i>x</i><sub>1</sub> + 6<i>x</i><sub>2</sub> = 150, &nbsp; <i>y</i><sub>2</sub> + <i>x</i><sub>1</sub> + 0,5<i>x</i><sub>2</sub> = 22, &nbsp; <i>y</i><sub>3</sub> + <i>x</i><sub>1</sub> + <i>x</i><sub>2</sub> = 27,5</div>
  <p>Setzt man zwei der fünf Variablen null, erhält man eine <b>Basislösung</b>. Sind alle Werte ≥ 0, ist sie zulässig. Zulässige Basislösungen entsprechen genau den Eckpunkten.</p>
  <ol class="steps">
    <li>Starttableau mit den Spalten <i>z</i>, <i>y</i><sub>1</sub>, …, <i>y<sub>m</sub></i>, <i>x</i><sub>1</sub>, …, <i>x<sub>n</sub></i>, rechte Seite. Start in <i>x</i> = 0.</li>
    <li><b>Pivotspalte:</b> die Spalte mit dem am stärksten negativen Eintrag in der ersten Zeile.</li>
    <li><b>Pivotelement:</b> Quotienten rechte Seite : positiver Eintrag der Pivotspalte bilden. Der kleinste Quotient bestimmt die Zeile.</li>
    <li>Mit Zeilenoperationen die Pivotspalte zum Einheitsvektor machen (1 an der Stelle des Pivotelements).</li>
    <li>Wiederholen, bis die erste Zeile keine negativen Einträge mehr hat.</li></ol>
  <ul class="keys"><li><b>Ablesen:</b> Variablen mit Einheitsvektor-Spalte haben den Wert der rechten Seite, alle anderen sind 0.</li><li>Geometrisch wandert das Verfahren von Eckpunkt zu Eckpunkt (Bäcker: 0 → A → B), wobei <i>z</i> nie abnimmt.</li></ul>`;
TH.dual = `
  <p>Wie ändert sich der maximale Gewinn, wenn eine Ressource um eine Einheit wächst? Beim Bäcker: Mehl +10/3, Zucker 0, Butter +10. Diese <b>Grenzgewinne</b> lösen das duale Problem.</p>
  <div class="f">(P) &nbsp; max <i>c</i>′<i>x</i> &nbsp; unter &nbsp; <i>A</i><i>x</i> ≤ <i>b</i>, <i>x</i> ≥ 0 &nbsp;&nbsp;&nbsp;&nbsp; (D) &nbsp; min <i>b</i>′<i>u</i> &nbsp; unter &nbsp; <i>A</i>′<i>u</i> ≥ <i>c</i>, <i>u</i> ≥ 0</div>
  <ul class="keys">
    <li>Die Koeffizienten der Zielfunktion des einen Problems sind die rechten Seiten des anderen. Die Koeffizientenmatrizen sind Transponierte voneinander.</li>
    <li>Interpretation beim Bäcker: Ein Käufer bietet Preise <i>u</i><sub>1</sub>, <i>u</i><sub>2</sub>, <i>u</i><sub>3</sub> je kg. Der Bäcker verlangt für die Zutaten jeder Sorte mindestens deren Gewinn (3<i>u</i><sub>1</sub> + <i>u</i><sub>2</sub> + <i>u</i><sub>3</sub> ≥ 20, 6<i>u</i><sub>1</sub> + 0,5<i>u</i><sub>2</sub> + <i>u</i><sub>3</sub> ≥ 30), der Käufer minimiert 150<i>u</i><sub>1</sub> + 22<i>u</i><sub>2</sub> + 27,5<i>u</i><sub>3</sub>.</li>
    <li>Die optimalen Werte beider Probleme sind gleich: <span class="m"><i>b</i>′<i>u</i>* = <i>c</i>′<i>x</i>*</span> (Bäcker: 775).</li>
    <li>Im Endtableau des Simplexverfahrens stehen <i>u</i><sub>1</sub>*, …, <i>u<sub>m</sub></i>* in der ersten Zeile unter den Schlupfvariablen.</li>
    <li>Eine Ressource, die im Optimum übrig bleibt, hat den Grenzgewinn 0.</li></ul>`;

function updateChip() {

function renderTopicList() {
  const ul = $("#topics");
  const subj = view.subj === "prog" ? null : view.subj;
  $("#side-title").textContent = subj ? "Themen" : "Bereiche";
  if (!subj) {
    ul.innerHTML = Object.entries(SUBJ).map(([k, v]) => `<li><button type="button" data-goto="${k}">${v}</button></li>`).join("");
    return;
  }
  let grp = "";
  ul.innerHTML = TOPICS.filter(t => t.subj === subj).map(t => {
    const p = progress[t.id];
    const sc = p ? `<span class="score${p.c >= 5 ? " full" : ""}">${p.c}/${p.t}</span>` : "";
    const head = t.group !== grp ? `<li class="grp${t.group.startsWith("Ausblick") ? " aus" : ""}">${(grp = t.group)}</li>` : "";
    return `${head}<li><button type="button" data-topic="${t.id}" aria-current="${view.topic[subj] === t.id}"><span>${t.title}</span>${sc}</button></li>`;
  }).join("");
}
function saveView() { store.set("mt-view2", view); }

  cleanups.forEach(f => f()); cleanups = []; redrawers = [];

/* ---------- Übungsaufgaben ---------- */
function renderExercise(box, topic) {
  const ex = topic.gen();
  let answered = false;
  const p = progress[topic.id];
  $("#ex-meta").textContent = p ? `${p.c} von ${p.t} richtig` : "Neue Zahlen bei jeder Aufgabe";
  const fieldHTML = (f, i) => {
    if (f.type === "select") return `<div class="field"><label class="lab" for="f${i}">${f.label}</label><select id="f${i}"><option value="">bitte wählen</option>${f.options.map(o => `<option>${o}</option>`).join("")}</select></div>`;
    if (f.type === "matrix") {
      let cells = "";
      for (let r = 0; r < f.rows; r++) for (let c = 0; c < f.cols; c++) cells += `<input type="text" class="mcell" id="f${i}_${r}_${c}" autocomplete="off" aria-label="Zeile ${r + 1}, Spalte ${c + 1}">`;
      return `<div class="field"><span class="lab">${f.label}</span><span class="mat in" style="grid-template-columns:repeat(${f.cols},auto)">${cells}</span></div>`;
    }
    return `<div class="field"><label class="lab" for="f${i}">${f.label}</label><input type="text" id="f${i}" autocomplete="off" spellcheck="false"></div>`;
  };
  box.innerHTML = `<div class="ex-prompt">${ex.prompt}</div>
    <form class="ex-fields" id="ex-form" novalidate>
      ${ex.fields.map(fieldHTML).join("")}
      <p class="hint">Dezimalkomma oder Bruch (z. B. 3/4) sind erlaubt. Kleine Rundungsabweichungen werden akzeptiert.</p>
      <div class="ex-actions">
        <button type="submit" class="btn primary">Prüfen</button>
        <button type="button" class="btn" id="ex-sol">Lösungsweg zeigen</button>
        <button type="button" class="btn ghost" id="ex-new">Neue Aufgabe →</button>
      </div>
    </form>
    <div class="feedback" id="ex-fb" hidden></div>
    <div class="solution" id="ex-solbox" hidden><h4>Lösungsweg</h4>${ex.solution}</div>`;
  const form = $("#ex-form", box);
  form.addEventListener("submit", e => {
    e.preventDefault();
    let good = 0;
    ex.fields.forEach((f, i) => {
      let ok;
      if (f.type === "select") {
        const el = $("#f" + i, box); ok = el.value === f.ans; mark([el], ok);
      } else if (f.type === "matrix") {
        const els = [], vals = [];
        for (let r = 0; r < f.rows; r++) { vals.push([]); for (let c = 0; c < f.cols; c++) { const el = $(`#f${i}_${r}_${c}`, box); els.push(el); vals[r].push(parseNum(el.value)); } }
        if (vals.flat().some(isNaN)) ok = false;
        else if (f.check) ok = f.check(vals);
        else ok = vals.every((row, r) => row.every((v, c) => Math.abs(v - f.ans[r][c]) <= f.tol));
        if (f.check) mark(els, ok);
        else els.forEach((el, k) => { const r = Math.floor(k / f.cols), c = k % f.cols; mark([el], !isNaN(vals[r][c]) && Math.abs(vals[r][c] - f.ans[r][c]) <= f.tol); });
      } else {
        const el = $("#f" + i, box), v = parseNum(el.value);
        ok = !isNaN(v) && (f.check ? f.check(v) : Math.abs(v - f.ans) <= f.tol); mark([el], ok);
      }
      if (ok) good++;
    });
    const all = good === ex.fields.length;
    const fb = $("#ex-fb", box);
    fb.hidden = false; fb.className = "feedback " + (all ? "good" : "bad");
    fb.textContent = all ? "Alles richtig." : `${good} von ${ex.fields.length} Angaben stimmen. Prüfe die rot markierten Felder oder sieh dir den Lösungsweg an.`;
    if (!answered) { answered = true; record(topic.id, all); const q = progress[topic.id]; $("#ex-meta").textContent = `${q.c} von ${q.t} richtig`; }
  });
  $("#ex-sol", box).addEventListener("click", () => {
    $("#ex-solbox", box).hidden = false;
    if (!answered) { answered = true; record(topic.id, false); const q = progress[topic.id]; $("#ex-meta").textContent = `${q.c} von ${q.t} richtig`; }
  });

/* ---------- Quiz ---------- */
function renderQuiz(box, topic) {
  const order = shuffle(topic.quiz.map((_, i) => i));
  let idx = 0, right = 0;
  function show() {
    if (idx >= order.length) {
      box.innerHTML = `<div class="card-head"><h3>Runde beendet</h3></div><p class="q-text">${right} von ${order.length} richtig.</p><button type="button" class="btn primary" id="q-again">Neue Runde</button>`;
      $("#q-again", box).addEventListener("click", () => renderQuiz(box, topic));
      return;
    }
    const [q, opts, expl] = topic.quiz[order[idx]];
    const shuffled = shuffle(opts.map((o, i) => ({ o, ok: i === 0 })));
    box.innerHTML = `<div class="card-head"><h3>Frage ${idx + 1} von ${order.length}</h3><span class="meta">${right} richtig</span></div>
      <p class="q-text">${q}</p>
      <div class="q-opts">${shuffled.map((s, i) => `<button type="button" data-i="${i}">${s.o}</button>`).join("")}</div>
      <div id="q-after"></div>`;
    box.querySelectorAll(".q-opts button").forEach(b => b.addEventListener("click", () => {
      const s = shuffled[+b.dataset.i];
      box.querySelectorAll(".q-opts button").forEach((x, i) => { x.disabled = true; if (shuffled[i].ok) x.classList.add("ok"); });
      if (!s.ok) b.classList.add("no"); else right++;
      record(topic.id, s.ok);
      $("#q-after", box).innerHTML = `<div class="q-expl"><b>${s.ok ? "Richtig." : "Nicht ganz."}</b> ${expl}</div><div class="ex-actions" style="margin-top:12px"><button type="button" class="btn primary" id="q-next">${idx + 1 < order.length ? "Nächste Frage →" : "Auswertung"}</button></div>`;
      $("#q-next", box).addEventListener("click", () => { idx++; show(); });
      $("#q-next", box).focus();
    }));
  }
  show();
}

/* ---------- Zeichenhilfen ---------- */
const cssv = (el, n) => getComputedStyle(el).getPropertyValue(n).trim();
function setupCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, cv.parentElement.clientWidth);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function watch(cv, draw) {
  redrawers.push(draw);
  let lastW = 0;
  const ro = new ResizeObserver(() => { const w = cv.parentElement.clientWidth; if (Math.abs(w - lastW) > 1) { lastW = w; draw(); } });
  ro.observe(cv.parentElement); cleanups.push(() => ro.disconnect());
}
function shadeArea(ctx, f, a, b, X, Y) {
  if (b <= a) return;
  ctx.beginPath(); ctx.moveTo(X(a), Y(0));
  for (let i = 0; i <= 120; i++) { const x = a + (b - a) * i / 120; ctx.lineTo(X(x), Y(f(x))); }
  ctx.lineTo(X(b), Y(0)); ctx.closePath(); ctx.fill();
}
function strokeCurve(ctx, f, a, b, X, Y) {
  ctx.beginPath();
  for (let i = 0; i <= 240; i++) { const x = a + (b - a) * i / 240; i ? ctx.lineTo(X(x), Y(f(x))) : ctx.moveTo(X(x), Y(f(x))); }
  ctx.stroke();
}
const MONO = '12px "JetBrains Mono", ui-monospace, monospace';

/* ---------- Werkzeug: KI-Simulation ---------- */
function toolKISim(el) {
  el.innerHTML = `<p class="tool-note">Grundgesamtheit: Normalverteilung mit <span class="m">μ = 100</span> und bekanntem <span class="m">σ = 15</span>. Jede waagerechte Linie ist ein Konfidenzintervall aus einer eigenen Zufallsstichprobe. Rot markierte Intervalle verfehlen μ.</p>

    data = Array.from({ length: 50 }, () => { const xb = 100 + se * gauss(); return { xb, lo: xb - q * se, hi: xb + q * se }; });
    const hits = data.filter(d => d.lo <= 100 && d.hi >= 100).length;
    total.hit += hits; total.all += 50;
    $("#ks-out", el).innerHTML = `${hits} von 50 Intervallen überdecken μ (${hits * 2} %). Seit der letzten Einstellung: ${total.hit} von ${total.all} = ${fmt(total.hit / total.all * 100, 1)} %, erwartet ${pct(conf)}. Halbe Breite: <span class="m">${fmt(q * se, 2)}</span>.`;

    const { ctx, w, h } = setupCanvas(cv, 360);

    const rowH = (h - T - B) / data.length;

      ctx.beginPath(); ctx.moveTo(X(Math.max(lo, d.lo)), y); ctx.lineTo(X(Math.min(hi, d.hi)), y); ctx.stroke();

function toolPValue(el) {

  }

}

      const r = Math.sqrt(Math.max(0, disc)), ls = [(tr - r) / 2, (tr + r) / 2];
      eig = r < 1e-9 ? `λ = ${fmt(ls[0], 2)} (doppelt)` : `λ₁ = ${fmt(ls[0], 2)}, λ₂ = ${fmt(ls[1], 2)}`;
      const scalar = Math.abs(b) < 1e-9 && Math.abs(c) < 1e-9 && Math.abs(a - d) < 1e-9;
      if (!scalar) {
        ctx.setLineDash([6, 5]); ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
        const uniq = r < 1e-9 ? [ls[0]] : ls;
        uniq.forEach(l => {
          let v = Math.abs(b) > 1e-9 ? [b, l - a] : Math.abs(c) > 1e-9 ? [l - d, c] : (Math.abs(l - a) < 1e-9 ? [1, 0] : [0, 1]);
          const nrm = Math.hypot(...v); v = [v[0] / nrm * 10, v[1] / nrm * 10];
          ctx.beginPath(); ctx.moveTo(...P(-v[0], -v[1])); ctx.lineTo(...P(v[0], v[1])); ctx.stroke();
        });
        ctx.setLineDash([]);
      }
    } else {
      const re = tr / 2, im = Math.sqrt(-disc) / 2;
      eig = `${fmt(re, 2)} ± ${fmt(im, 2)}i (keine reelle Eigenrichtung)`;
    }
    const arrow = (x, y, col) => {
      const [x0, y0] = P(0, 0), [x1, y1] = P(x, y), ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      if (len > 6) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 11 * Math.cos(ang - 0.4), y1 - 11 * Math.sin(ang - 0.4)); ctx.lineTo(x1 - 11 * Math.cos(ang + 0.4), y1 - 11 * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill(); }
    };
    arrow(a, c, v1); arrow(b, d, v2);
    ctx.restore();
    $("#lm-read", el).innerHTML = `<dt>det <i>A</i></dt><dd>${fmt(det, 2)}${det < 0 ? " · Orientierung umgekehrt" : Math.abs(det) < 1e-9 ? " · Ebene kollabiert" : ""}</dd>
      <dt>Flächenfaktor</dt><dd>${fmt(Math.abs(det), 2)}</dd><dt>Spur</dt><dd>${fmt(tr, 2)}</dd><dt>Eigenwerte</dt><dd>${eig}</dd>`;
  }
  ins.forEach(x => x.addEventListener("input", draw));
  el.querySelectorAll("[data-p]").forEach(btn => btn.addEventListener("click", () => {
    PRESETS[+btn.dataset.p][1].forEach((v, i) => { ins[i].value = v; }); draw();
  }));
  watch(cv, draw); draw();
}

/* ---------- Thema & Start ---------- */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
const redrawAll = () => redrawers.forEach(f => f());
if (mq.addEventListener) mq.addEventListener("change", redrawAll);
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
updateChip();
render();
</script>
